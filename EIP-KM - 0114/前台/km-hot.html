<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熱門文章 - KM 知識管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <link rel="stylesheet" href="css/style-search.css">
    <style>
        /* ===== 熱門文章頁專用 ===== */

        /* 頁面標題區 */
        .page-title-bar {
            padding: 24px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .page-title-bar h2 {
            font-size: var(--font-page-title);
            font-weight: 700;
            color: #111827;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title-bar h2 i { color: #F59E0B; }
        .page-title-bar .page-desc {
            color: #9CA3AF;
            font-size: 13px;
            margin: 4px 0 0;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; color: #6B7280; text-decoration: none;
            padding: 6px 12px; border-radius: 8px;
            transition: all .15s;
        }
        .back-link:hover { background: #F3F4F6; color: #4F46E5; }

        /* 篩選列 */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0 16px;
            flex-wrap: wrap;
        }
        .filter-bar select {
            padding: 8px 14px;
            border: 1px solid #E5E8ED;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            color: #374151;
            cursor: pointer;
            transition: border-color .2s;
        }
        .filter-bar select:focus {
            outline: none;
            border-color: #4F46E5;
        }
        .filter-bar .filter-label {
            font-size: 13px;
            color: #9CA3AF;
            font-weight: 600;
        }

        /* 結果統計 */
        .result-count {
            font-size: 13px;
            color: #9CA3AF;
            margin-bottom: 12px;
        }
        .result-count strong { color: #111827; }

        /* 文章列表卡片 */
        .hot-list-card {
            background: #FFFFFF;
            border: 1px solid #E5E8ED;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.02);
            overflow: hidden;
        }

        /* 文章項 */
        .hot-article-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid #F0F1F3;
            cursor: pointer;
            transition: background .15s;
        }
        .hot-article-item:last-child { border-bottom: none; }
        .hot-article-item:hover { background: #F3F4F6; }

        .hot-article-item .rank-badge {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
        }
        .rank-badge.rank-1 { background: #FEF3C7; color: #D97706; }
        .rank-badge.rank-2 { background: #F1F5F9; color: #475569; }
        .rank-badge.rank-3 { background: #FFF7ED; color: #C2410C; }
        .rank-badge.rank-other { background: #F9FAFB; color: #9CA3AF; }

        .hot-article-item .article-info { flex: 1; min-width: 0; }
        .hot-article-item .article-title {
            font-size: 15px; font-weight: 600; color: #111827;
            margin-bottom: 6px; line-height: 1.4;
        }
        .hot-article-item:hover .article-title { color: #4F46E5; }
        .hot-article-item .article-meta {
            display: flex; align-items: center; gap: 12px;
            font-size: 12px; color: #9CA3AF; flex-wrap: wrap;
        }
        .hot-article-item .article-meta span {
            display: flex; align-items: center; gap: 4px;
        }
        .hot-article-item .article-tags {
            display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap;
        }
        .hot-article-item .article-tags .tag {
            font-size: 11px; padding: 2px 8px; border-radius: 6px;
            border: 1px solid #E5E8ED; color: #6B7280; background: #F9FAFB;
        }

        .hot-article-item .view-count {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex-shrink: 0; padding: 0 8px;
        }
        .hot-article-item .view-count .vc-num {
            font-size: 18px; font-weight: 800; color: #4F46E5;
        }
        .hot-article-item .view-count .vc-label {
            font-size: 11px; color: #9CA3AF;
        }

        /* 分頁 */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 20px 0;
        }
        .pagination .page-btn {
            min-width: 36px; height: 36px; border-radius: 8px;
            border: 1px solid #E5E8ED; background: #fff;
            font-size: 13px; font-weight: 600; color: #6B7280;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all .15s;
        }
        .pagination .page-btn:hover { background: #F3F4F6; border-color: #D1D5DB; }
        .pagination .page-btn.active {
            background: #4F46E5; color: #fff; border-color: #4F46E5;
        }
        .pagination .page-btn:disabled {
            opacity: .4; cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- 頂部導航 -->
    <div id="header-container"></div>

    <!-- 側邊欄 -->
    <div id="sidebar-container"></div>

    <!-- 主要內容區 -->
    <div class="main-content">
        <!-- KM 知識管理導航 -->
        <div id="km-nav-container"></div>

        <div class="km-container">
            <!-- 返回 + 標題 -->
            <a class="back-link" href="km-knowledge.html"><i class="fa-solid fa-arrow-left"></i> 返回知識總覽</a>
            <div class="page-title-bar">
                <div>
                    <h2><i class="fa-solid fa-fire"></i> 熱門文章</h2>
                    <p class="page-desc">依瀏覽量排序的熱門知識庫文章</p>
                </div>
            </div>

            <!-- 篩選列 -->
            <div class="filter-bar">
                <span class="filter-label">篩選：</span>
                <select id="filterDept" onchange="filterArticles()">
                    <option value="">全部部門</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="BU1">BU1</option>
                    <option value="BU2">BU2</option>
                    <option value="Admin">Admin</option>
                </select>
                <select id="filterPeriod" onchange="filterArticles()">
                    <option value="all">不限時間</option>
                    <option value="week">近一週</option>
                    <option value="month" selected>近一個月</option>
                    <option value="quarter">近一季</option>
                    <option value="year">近一年</option>
                </select>
            </div>

            <!-- 結果統計 -->
            <div class="result-count" id="resultCount"></div>

            <!-- 文章列表 -->
            <div class="hot-list-card" id="hotListCard"></div>

            <!-- 分頁 -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- ===== 文章內頁 Modal ===== -->
    <div class="article-modal-overlay" id="articleModal">
        <div class="article-modal">
            <div class="am-header">
                <h3 id="amTitle">—</h3>
                <button class="btn ghost" onclick="closeArticleModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="am-meta" id="amMeta"></div>
            <div class="am-body" id="amBody"></div>
            <div class="am-footer">
                <button class="btn" onclick="closeArticleModal()">關閉</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JS 引用 -->
    <script src="js/main-script.js"></script>
    <script src="js/sidebar-script.js"></script>
    <script src="shared/layout-loader.js"></script>
    <script src="js/km-base.js"></script>

    <script>
    /* ============================================================
       熱門文章 — 完整列表（假資料）
       ============================================================ */

    const _allHotArticles = [
        { id:'h01', title:'差旅報銷規範修訂公告', author:'吳佳蓉', dept:'Finance', date:'2026-03-14', views:1024, tags:['差旅','報銷','公告'],
          content:'<p>自 2026年4月1日起，差旅報銷規範將進行以下調整：</p><p>1. 國內出差住宿費上限調整為每晚 NT$3,500<br>2. 交通費須於 3 個工作天內提交核銷<br>3. 新增線上簽核流程，無需紙本表單</p>' },
        { id:'h02', title:'請假制度常見問題 FAQ', author:'李美玲', dept:'HR', date:'2026-02-20', views:876, tags:['請假','FAQ'],
          content:'<p>Q: 特休假可以保留到隔年嗎？<br>A: 依勞基法規定，特休假應於當年度休完，未休完者依規定結算。</p><p>Q: 病假需要提供證明嗎？<br>A: 連續請假 3 天以上需附醫療證明。</p>' },
        { id:'h03', title:'入職流程 SOP 完整指南', author:'李美玲', dept:'HR', date:'2026-01-15', views:654, tags:['SOP','入職'],
          content:'<p>新進人員入職流程：</p><p>1. 報到日攜帶身分證、畢業證書、存摺影本<br>2. IT 部門領取筆電及帳號<br>3. 完成新人訓練（約 3 天）<br>4. 部門主管安排工作交接</p>' },
        { id:'h04', title:'Code Review 規範 v2.0', author:'蔡明達', dept:'BU1', date:'2026-03-13', views:512, tags:['規範','CR'],
          content:'<p>Code Review 規範主要修訂：</p><p>• PR 必須至少 2 人 Approve 才可合併<br>• 新增安全性檢查清單<br>• CI pipeline 需全部通過</p>' },
        { id:'h05', title:'X 專案技術架構圖 V3', author:'張志豪', dept:'BU2', date:'2026-03-10', views:389, tags:['架構','專案'],
          content:'<p>X 專案第三版架構圖已更新，採用微服務架構，包含以下服務：</p><p>• API Gateway<br>• Auth Service<br>• User Service<br>• Notification Service</p>' },
        { id:'h06', title:'2025年度財務報表摘要', author:'吳佳蓉', dept:'Finance', date:'2026-03-12', views:301, tags:['財報','年度'],
          content:'<p>2025年度主要數據：</p><p>• 營收較去年成長 12%<br>• 營業利益率維持 18%<br>• 研發投入佔營收比例提升至 15%</p>' },
        { id:'h07', title:'新人指南 — 快速上手', author:'黃淑芬', dept:'BU2', date:'2026-02-01', views:278, tags:['新人','指南'],
          content:'<p>歡迎加入！以下是快速上手指南：</p><p>1. 熟悉內部系統（EIP、KM、HR 系統）<br>2. 了解團隊協作工具（Teams、Jira）<br>3. 閱讀部門 Wiki 文件</p>' },
        { id:'h08', title:'資安政策宣導 — 2026年度', author:'陳建宏', dept:'BU1', date:'2026-03-01', views:245, tags:['資安','政策'],
          content:'<p>2026年度資安政策重點：</p><p>• 密碼每 90 天更換一次<br>• 禁止使用個人雲端儲存公司資料<br>• VPN 連線需啟用二階段驗證</p>' },
        { id:'h09', title:'專案管理流程標準化', author:'林志偉', dept:'BU2', date:'2026-02-15', views:198, tags:['專案','流程'],
          content:'<p>專案管理標準流程包含五大階段：啟動、規劃、執行、監控、結案。每個階段皆需產出對應文件並經過審核。</p>' },
        { id:'h10', title:'員工福利手冊 2026 版', author:'李美玲', dept:'HR', date:'2026-01-10', views:187, tags:['福利','HR'],
          content:'<p>2026年度員工福利包含：</p><p>• 年度健檢補助 NT$5,000<br>• 教育訓練補助每年 NT$20,000<br>• 社團活動補助<br>• 彈性工時制度</p>' },
        { id:'h11', title:'會議室預約系統使用說明', author:'楊淑惠', dept:'Admin', date:'2026-02-28', views:165, tags:['會議室','系統'],
          content:'<p>會議室預約系統已上線，請至 EIP 系統中進行預約。大型會議室需提前 3 天預約，並於使用後完成設備歸還。</p>' },
        { id:'h12', title:'API 設計規範 RESTful 指南', author:'許家豪', dept:'BU1', date:'2026-03-05', views:156, tags:['API','規範'],
          content:'<p>RESTful API 設計原則：</p><p>• 使用標準 HTTP 動詞<br>• 資源名稱使用複數名詞<br>• 版本控制使用 URL prefix<br>• 回傳統一格式的 JSON 結構</p>' },
        { id:'h13', title:'績效考核制度說明', author:'李美玲', dept:'HR', date:'2026-01-25', views:143, tags:['績效','HR'],
          content:'<p>績效考核分為年中考核與年度考核，評核項目包含：工作目標達成率、職能展現、團隊合作等三大面向。</p>' },
        { id:'h14', title:'雲端服務費用管理規範', author:'吳佳蓉', dept:'Finance', date:'2026-02-10', views:132, tags:['雲端','費用'],
          content:'<p>各部門使用雲端服務（AWS、Azure、GCP）需事先提出預算申請，月費超過 NT$50,000 需經部門主管核准。</p>' },
        { id:'h15', title:'BU2 新人訓練教材', author:'黃淑芬', dept:'BU2', date:'2026-03-08', views:121, tags:['培訓','BU2'],
          content:'<p>BU2 新人訓練為期兩週，包含：技術基礎培訓、專案流程介紹、開發環境建置、程式碼規範說明。</p>' },
    ];

    const PAGE_SIZE = 10;
    let _currentPage = 1;
    let _filtered = [];

    (function init() {
        filterArticles();
    })();

    function filterArticles() {
        const dept = document.getElementById('filterDept').value;
        _filtered = _allHotArticles.filter(a => !dept || a.dept === dept);
        _currentPage = 1;
        renderList();
    }

    function renderList() {
        const start = (_currentPage - 1) * PAGE_SIZE;
        const page = _filtered.slice(start, start + PAGE_SIZE);

        document.getElementById('resultCount').innerHTML =
            `共 <strong>${_filtered.length}</strong> 篇熱門文章`;

        const host = document.getElementById('hotListCard');
        if (!page.length) {
            host.innerHTML = '<div style="padding:40px;text-align:center;color:#9CA3AF;"><i class="fa-solid fa-fire" style="font-size:24px;margin-bottom:8px;display:block;"></i>沒有符合條件的文章</div>';
        } else {
            host.innerHTML = page.map((a, idx) => {
                const globalIdx = start + idx;
                const rankClass = globalIdx < 3 ? 'rank-' + (globalIdx + 1) : 'rank-other';
                return `
                <div class="hot-article-item" onclick="openArticle('${a.id}')">
                    <div class="rank-badge ${rankClass}">${globalIdx + 1}</div>
                    <div class="article-info">
                        <h4 class="article-title">${escHtml(a.title)}</h4>
                        <div class="article-meta">
                            <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                            <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                            <span><i class="fa-regular fa-calendar"></i> ${a.date}</span>
                        </div>
                        <div class="article-tags">${(a.tags || []).map(t => '<span class="tag">' + escHtml(t) + '</span>').join('')}</div>
                    </div>
                    <div class="view-count">
                        <div class="vc-num">${a.views.toLocaleString()}</div>
                        <div class="vc-label">瀏覽</div>
                    </div>
                </div>`;
            }).join('');
        }

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(_filtered.length / PAGE_SIZE);
        if (totalPages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
        let html = `<button class="page-btn" onclick="goPage(${_currentPage - 1})" ${_currentPage === 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left"></i></button>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="page-btn ${i === _currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" onclick="goPage(${_currentPage + 1})" ${_currentPage === totalPages ? 'disabled' : ''}><i class="fa-solid fa-chevron-right"></i></button>`;
        document.getElementById('pagination').innerHTML = html;
    }

    function goPage(p) {
        const totalPages = Math.ceil(_filtered.length / PAGE_SIZE);
        if (p < 1 || p > totalPages) return;
        _currentPage = p;
        renderList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== 文章 Modal =====
    function openArticle(id) {
        const article = _allHotArticles.find(a => a.id === id);
        if (!article) return;
        document.getElementById('amTitle').textContent = article.title;
        document.getElementById('amMeta').innerHTML = `
            <span><i class="fa-solid fa-user"></i> ${escHtml(article.author)}</span>
            <span><i class="fa-solid fa-building"></i> ${escHtml(article.dept)}</span>
            ${article.date ? '<span><i class="fa-regular fa-calendar"></i> ' + article.date + '</span>' : ''}
            <span><i class="fa-solid fa-eye"></i> ${article.views.toLocaleString()} 次瀏覽</span>
            ${(article.tags || []).map(t => '<span style="font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #E5E8ED;background:#fff;">' + escHtml(t) + '</span>').join('')}
        `;
        document.getElementById('amBody').innerHTML = article.content || '<p style="color:#9CA3AF;text-align:center;padding:40px 0;">文章內容載入中…</p>';
        document.getElementById('articleModal').classList.add('show');
    }
    function closeArticleModal() {
        document.getElementById('articleModal').classList.remove('show');
    }
    document.getElementById('articleModal').addEventListener('click', function (e) {
        if (e.target === this) closeArticleModal();
    });

    // ===== 工具 =====
    function escHtml(str) {
        const el = document.createElement('span');
        el.textContent = str;
        return el.innerHTML;
    }
    </script>
    <script src="js/search.js"></script>
</body>
</html>
