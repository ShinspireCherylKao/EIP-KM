<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章內頁 - KM 知識管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <link rel="stylesheet" href="css/style-search.css">
    <style>
        /* ===== 文章內頁專用 ===== */

        /* 返回列 */
        .article-back-bar {
            margin-bottom: var(--spacing-element);
        }
        .article-back-bar a {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 15px; color: var(--text-secondary); text-decoration: none;
            padding: 8px 14px; border-radius: var(--radius-sm);
            min-height: var(--touch-target-min);
            transition: all .15s;
        }
        .article-back-bar a:hover { background: var(--hover-bg); color: var(--primary-color); }

        /* 文章主卡片（沿用總覽頁 km-block 風格） */
        .article-detail-card {
            background: #fff;
            border: 1px solid rgba(0,0,0,.125);
            border-radius: .25rem;
            margin-left: 14px;
            box-shadow: rgba(176,184,214,0.09) 0px 10px 10px 20px,
                        rgb(176,184,214) 10px 10px 15px -5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow .2s;
        }

        /* 文章頭部（沿用 block-header 風格） */
        .article-detail-header {
            padding: 20px var(--spacing-card, 20px);
            min-height: 48px;
            border-top: 20px solid #fff;
            border-bottom: 20px solid #fff;
            display: flex;
            align-items: center;
            background: #fff;
        }
        .article-detail-header h2 {
            font-size: var(--font-section-title, 18px); font-weight: 700; color: var(--text-primary);
            margin: 0; line-height: 1.1;
        }

        /* 文章 meta 資訊格 */
        .article-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px 24px;
            padding: var(--spacing-compact, 12px) var(--spacing-card, 20px);
            background: #F8FAFC;
            border-bottom: 1px solid #F0F1F3;
        }
        .meta-item {
            display: flex; flex-direction: column; gap: 2px; font-size: 14px;
        }
        .meta-item .meta-label { color: var(--text-muted); font-size: 13px; }
        .meta-item .meta-value { font-weight: 600; color: var(--text-primary); font-size: 15px; }

        /* 文件效期特殊樣式 */
        .validity-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
        }
        .validity-badge.active { background: #ECFDF5; color: #059669; }
        .validity-badge.expiring { background: #FEF3C7; color: #B45309; }
        .validity-badge.permanent { background: #EEF2FF; color: #4F46E5; }
        .validity-badge.until-delete { background: #F1F5F9; color: #475569; }

        /* 文章內文 */
        .article-body {
            padding: var(--spacing-element, 16px) var(--spacing-card, 20px);
            font-size: var(--font-body, 15px); line-height: 1.9; color: var(--text-primary);
        }
        .article-body p { margin-bottom: 16px; }
        .article-body h3 { font-size: 16px; font-weight: 700; margin: 24px 0 12px; color: var(--text-primary); }
        .article-body ul, .article-body ol { margin: 0 0 16px 20px; }
        .article-body li { margin-bottom: 6px; line-height: 1.7; }
        .article-body a { color: var(--primary-color); text-decoration: underline; }
        .article-body a:hover { color: var(--primary-dark); }
        .article-body .highlight-box {
            background: #FFF7ED; border-left: 4px solid #F59E0B;
            padding: 14px 18px; border-radius: 0 8px 8px 0; margin: 16px 0;
            font-size: 14px; color: #92400E;
        }
        .article-body .info-box {
            background: #EFF6FF; border-left: 4px solid #3B82F6;
            padding: 14px 18px; border-radius: 0 8px 8px 0; margin: 16px 0;
            font-size: 14px; color: #1E40AF;
        }

        /* 附件區 */
        .attachments-section {
            padding: var(--spacing-element, 16px) var(--spacing-card, 20px);
            border-top: 1px solid #F0F1F3;
            background: #FAFBFC;
        }
        .attachments-section h4 {
            font-size: var(--font-card-title, 16px); font-weight: 700; margin: 0 0 12px;
            display: flex; align-items: center; gap: 6px; color: var(--text-primary);
        }
        .attachment-list { display: flex; flex-direction: column; gap: 8px; }
        .attachment-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; background: #fff; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); transition: all .15s; cursor: pointer;
        }
        .attachment-item:hover { border-color: var(--primary-color); box-shadow: 0 2px 8px rgba(59,130,246,.1); }
        .attachment-item .att-icon {
            width: 40px; height: 40px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .att-icon.pdf { background: #FEF2F2; color: #DC2626; }
        .att-icon.doc { background: #EFF6FF; color: #2563EB; }
        .att-icon.xls { background: #ECFDF5; color: #059669; }
        .att-icon.ppt { background: #FFF7ED; color: #EA580C; }
        .attachment-item .att-info { flex: 1; min-width: 0; }
        .attachment-item .att-name { font-size: var(--font-body, 15px); font-weight: 600; color: var(--text-primary); }
        .attachment-item .att-meta { font-size: var(--font-label, 13px); color: var(--text-muted); margin-top: 2px; }
        .attachment-item .att-source {
            font-size: var(--font-label, 13px); padding: 2px 8px; border-radius: 999px;
            background: #EEF2FF; color: #4F46E5; font-weight: 600; white-space: nowrap;
        }
        .attachment-item .att-download {
            font-size: var(--font-body, 15px); color: var(--primary-color); padding: 4px 8px;
            border-radius: 6px; transition: background .15s;
        }
        .attachment-item .att-download:hover { background: #EEF2FF; }

        /* 底部返回按鈕 */
        .article-bottom-bar {
            padding: 20px var(--spacing-card, 20px);
            border-top: 1px solid #F0F1F3;
            display: flex;
            justify-content: center;
        }
        .btn-back-bottom {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 28px;
            font-size: 14px; font-weight: 600;
            border-radius: var(--radius-sm);
            text-decoration: none;
            cursor: pointer;
            transition: all .15s;
            border: none;
        }
        .btn-back-bottom.style-dark {
            background: #1E293B; color: #fff;
        }
        .btn-back-bottom.style-dark:hover {
            background: #334155;
        }
        .btn-back-bottom.style-outline {
            background: #fff; color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        .btn-back-bottom.style-outline:hover {
            background: #EEF2FF;
        }

        /* 連結卡片 */
        .link-card {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; background: #fff; border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); margin: 12px 0; transition: all .15s;
            text-decoration: none; color: inherit;
        }
        .link-card:hover { border-color: var(--primary-color); box-shadow: 0 2px 8px rgba(59,130,246,.1); }
        .link-card .link-icon {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            background: #EEF2FF; color: #4F46E5; font-size: 14px; flex-shrink: 0;
        }
        .link-card .link-text { font-size: 13px; font-weight: 600; color: var(--primary-color); }
        .link-card .link-desc { font-size: 12px; color: var(--text-muted); }

        /* ===== 手機版 RWD ===== */
        @media (max-width: 768px) {
            .article-detail-header {
                padding: 20px 16px;
            }
            .article-detail-header h2 {
                font-size: 16px;
            }
            .article-meta-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px 12px;
                padding: 12px 16px;
            }
            .meta-item .meta-label { font-size: 12px; }
            .meta-item .meta-value { font-size: 14px; }
            .article-body {
                padding: 20px 16px;
                font-size: 14px;
            }
            .article-body h3 { font-size: 15px; }
            .article-body .highlight-box,
            .article-body .info-box {
                padding: 10px 12px;
                font-size: 13px;
            }
            .attachments-section {
                padding: 16px;
            }
            .attachment-item {
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px 12px;
            }
            .attachment-item .att-info {
                min-width: 0;
                flex: 1 1 calc(100% - 54px);
            }
            .attachment-item .att-name {
                white-space: normal;
                word-break: break-all;
            }
            .attachment-item .att-source {
                order: 4;
                margin-left: 46px;
            }
        }

        @media (max-width: 480px) {
            .article-meta-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .article-detail-header h2 {
                font-size: 16px;
            }
        }

    </style>
</head>

                <p>為配合公司 2026 年度政策調整，財務部門經內部審議後，決議修訂差旅報銷相關規範。本次修訂已通過主管會議核准，自 <b>2026 年 4 月 1 日</b>起正式實施。</p>

                <p>依據勞動基準法規定，滿 6 個月未滿 1 年者為 3 天，滿 1 年未滿 2 年者為 7 天，依年資遞增。公司採 <b>到職日制</b> 計算，非曆年制。</p>

                <h3>一、入職前準備（報到前 3 天）</h3>

                    <li>IT 部門完成帳號建立：Email、EIP 系統、VPN、內部通訊軟體</li>
                    <li>行政部門準備工位、識別證、辦公用品</li>
                    <li>直屬主管指定 Buddy（新人夥伴）</li>
                </ul>

                <h3>二、報到日流程</h3>
                <ol>
                    <li><b>09:00</b> — 至大廳報到，HR 引導至會議室</li>
                    <li><b>09:15</b> — 繳交入職文件（身分證影本、學歷證明、緊急聯絡人資料等）</li>
                    <li><b>09:45</b> — 簽署勞動合約與保密協議</li>
                    <li><b>10:30</b> — 公司簡介與文化導覽（含辦公室環境介紹）</li>
                    <li><b>11:30</b> — IT 系統設定協助（筆電發放、帳號啟用、VPN 設定）</li>
                    <li><b>13:30</b> — 部門介紹與 Buddy 交接</li>
                    <li><b>15:00</b> — 線上必修課程說明（含 <a href="javascript:void(0)">資安教育訓練</a>、<a href="javascript:void(0)">性平宣導</a>）</li>

                <h3>三、試用期管理</h3>
                <p>試用期為 <b>3 個月</b>，期間由直屬主管與 Buddy 共同協助新進同仁適應工作環境。</p>

                    <li>第 3 個月末：完成最終評核，決定是否轉正</li>

                </div>

                <h3>四、轉正流程</h3>
                <p>試用期通過後，HR 將發送轉正通知信，同步更新系統權限設定。轉正後即享有完整員工福利（特休假、績效獎金等）。</p>

                    <li>回傳統一格式的 JSON 結構，含 <code>data</code>、<code>message</code>、<code>code</code></li>
                </ul>
                <h3>二、命名規範</h3>
                <p>URL 使用 kebab-case，JSON 欄位使用 camelCase，HTTP Header 使用 PascalCase。</p>
                <h3>三、錯誤處理</h3>
                <p>統一使用 HTTP 狀態碼，4xx 為客戶端錯誤、5xx 為伺服器錯誤。錯誤回應需包含 error code 與人類可讀的 message。</p>
                <h3>四、分頁規範</h3>
                <p>使用 <code>page</code> 與 <code>size</code> 參數，回傳需包含 <code>totalElements</code>、<code>totalPages</code>、<code>currentPage</code>。</p>
            `,

                <h3>一、修訂目的</h3>
                <p>隨著團隊規模擴大至 60 人以上，為確保程式碼品質與安全性，Code Review 規範更新至 v2.0。本次修訂納入 OWASP 安全性檢查、效能審查項目，並提高 Approve 門檻。</p>

                    <li><b>效能審查</b>：增加 N+1 查詢檢查、記憶體洩漏偵測、API 回應時間評估</li>

            content: `
                <h3>一、架構總覽</h3>
                <p>X 專案第三版架構圖已更新，全面採用微服務架構，以提升系統的可擴展性與維護性。以下為核心服務清單：</p>
                <ul>
                    <li><b>API Gateway</b> — 統一入口，負責路由、認證、限流（使用 Kong）</li>
                    <li><b>Auth Service</b> — JWT Token 管理與 OAuth 2.0 整合</li>
                    <li><b>User Service</b> — 使用者管理與組織結構查詢</li>
                    <li><b>Notification Service</b> — Email / Push / 站內信通知</li>
                    <li><b>File Service</b> — 檔案上傳、儲存、版本管理（MinIO + S3 Compatible）</li>
                    <li><b>Search Service</b> — 全文檢索引擎（Elasticsearch 8.x）</li>
                </ul>

                <h3>二、部署架構</h3>
                <p>採用 Kubernetes 部署，搭配 Helm Chart 進行版本管理。生產環境配置 3 節點叢集，預留水平擴展能力。</p>
                <ul>
                    <li><b>容器編排</b>：Kubernetes 1.28 + Helm 3</li>
                    <li><b>CI/CD</b>：GitLab CI → Harbor → ArgoCD</li>
                    <li><b>監控</b>：Prometheus + Grafana + Alertmanager</li>
                    <li><b>日誌</b>：EFK Stack（Elasticsearch + Fluentd + Kibana）</li>
                </ul>

                <h3>三、資料庫設計</h3>
                <p>主要資料庫使用 PostgreSQL 16，快取層使用 Redis 7.x，全文檢索使用 Elasticsearch 8.x。各微服務擁有獨立資料庫，透過事件驅動（Event-Driven）進行跨服務資料同步。</p>

            tags: ['專案', '流程', 'Scrum'], validity: { type: 'permanent', label: '永久有效', icon: 'fa-shield-check' },
            content: `
                <h3>一、流程概覽</h3>
                <p>專案管理標準流程包含五大階段，每個階段皆需產出對應文件並經過審核。所有專案一律遵循本流程，確保品質與可追蹤性。</p>
                <ol>
                    <li><b>啟動</b>：確認專案範圍、目標、利害關係人，產出 Project Charter</li>
                    <li><b>規劃</b>：制定時程（Gantt Chart）、資源配置、風險評估，產出 Project Plan</li>
                    <li><b>執行</b>：依計畫進行開發，透過 Daily Standup 追蹤進度，Sprint 為期 2 週</li>
                    <li><b>監控</b>：定期檢視進度與品質指標（Code Coverage ≥ 80%、Bug 收斂率），進行風險管理</li>
                    <li><b>結案</b>：完成驗收、知識轉移、經驗回顧（Retrospective），產出結案報告</li>
                </ol>

                <h3>二、角色與職責</h3>
                <ul>
                    <li><b>Product Owner</b>：負責需求優先序與驗收標準</li>
                    <li><b>Scrum Master</b>：負責流程順暢與團隊障礙排除</li>
                    <li><b>Tech Lead</b>：負責技術方案與架構決策</li>
                    <li><b>開發團隊</b>：負責實作、測試與交付</li>
                </ul>

                <h3>三、工具使用</h3>
                <p>統一使用以下工具進行專案管理：</p>
                <ul>
                    <li><b>Jira</b>：任務管理、Sprint Board、Burndown Chart</li>
                    <li><b>Confluence</b>：專案文件、會議記錄、技術文件</li>
                    <li><b>Teams</b>：日常溝通、每日站會</li>
                    <li><b>GitLab</b>：原始碼管理、CI/CD Pipeline</li>
                </ul>

                <div class="info-box"><i class="fa-solid fa-circle-info"></i> 新專案啟動前請先與 PMO 聯繫，取得專案編號並建立 Jira Project。</div>

            content: `
                <h3>一、基本原則</h3>
                <ul>
                    <li>使用標準 HTTP 動詞：<code>GET</code>（查詢）、<code>POST</code>（新增）、<code>PUT</code>（整體更新）、<code>PATCH</code>（部分更新）、<code>DELETE</code>（刪除）</li>
                    <li>資源名稱使用複數名詞（如 <code>/api/users</code>、<code>/api/articles</code>）</li>
                    <li>版本控制使用 URL prefix（如 <code>/api/v1/</code>）</li>
                    <li>回傳統一格式的 JSON 結構，含 <code>data</code>、<code>message</code>、<code>code</code></li>
                </ul>

                <h3>二、命名規範</h3>
                <ul>
                    <li>URL path：<code>kebab-case</code>（如 <code>/api/v1/user-profiles</code>）</li>
                    <li>JSON 欄位：<code>camelCase</code>（如 <code>firstName</code>、<code>createdAt</code>）</li>
                    <li>HTTP Header：<code>PascalCase</code>（如 <code>Content-Type</code>、<code>X-Request-Id</code>）</li>
                    <li>Query Parameter：<code>camelCase</code>（如 <code>?pageSize=20&sortBy=createdAt</code>）</li>
                </ul>

                <h3>三、錯誤處理</h3>
                <p>統一使用 HTTP 狀態碼，4xx 為客戶端錯誤、5xx 為伺服器錯誤。錯誤回應需包含 error code 與人類可讀的 message：</p>
                <pre style="background:#F8FAFC;padding:12px;border-radius:8px;font-size:13px;overflow-x:auto;">{
  "code": "VALIDATION_ERROR",
  "message": "欄位驗證失敗",
  "errors": [
    { "field": "email", "message": "Email 格式不正確" }
  ]
}</pre>

                <h3>四、分頁規範</h3>
                <p>使用 <code>page</code> 與 <code>size</code> 參數，回傳需包含 <code>totalElements</code>、<code>totalPages</code>、<code>currentPage</code>。預設 <code>size=20</code>，最大 <code>size=100</code>。</p>

                <h3>五、認證與授權</h3>
                <p>所有 API 需透過 JWT Bearer Token 認證，Token 有效期為 1 小時，Refresh Token 有效期為 7 天。</p>

                <div class="info-box"><i class="fa-solid fa-circle-info"></i> 完整規範文件與 Postman Collection 請參閱附件。</div>

    }

    // ===== 附件 =====
    function renderAttachments(attachments) {
        const list = document.getElementById('attachmentList');
        if (!attachments || !attachments.length) {
            document.getElementById('attachmentsSection').style.display = 'none';
            return;
        }
        list.innerHTML = attachments.map(att => {
            const iconClass = att.type === 'pdf' ? 'pdf' : att.type === 'doc' ? 'doc' : att.type === 'xls' ? 'xls' : 'ppt';
            const iconName = att.type === 'pdf' ? 'fa-file-pdf' : att.type === 'doc' ? 'fa-file-word' : att.type === 'xls' ? 'fa-file-excel' : 'fa-file-powerpoint';
            return `
                <div class="attachment-item">
                    <div class="att-icon ${iconClass}"><i class="fa-solid ${iconName}"></i></div>
                    <div class="att-info">
                        <div class="att-name">${escHtml(att.name)}</div>
                        <div class="att-meta">${att.size}・發佈核准日 ${att.approvedDate}</div>
                    </div>
                    <span class="att-source"><i class="fa-solid fa-folder"></i> ${escHtml(att.source)}</span>
                    <span class="att-download" title="下載"><i class="fa-solid fa-download"></i></span>
                </div>
            `;
        }).join('');
    }



    // ===== 工具函式 =====
    function escHtml(str) {
        const el = document.createElement('span');
        el.textContent = str;
        return el.innerHTML;
    }
    </script>
    <script src="js/search.js"></script>
</body>
</html>
