<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM 知識管理 - 企業入口網站</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <link rel="stylesheet" href="css/style-search.css">
    <link rel="stylesheet" href="css/style-km-knowledge.css">
</head>
<body>
    <!-- 頂部導航 -->
    <div id="header-container"></div>
    
    <!-- 側邊欄 -->
    <div id="sidebar-container"></div>
    
    <!-- 主要內容區 -->
    <div class="main-content">
        <!-- 頁面標題 -->
        <div class="km-page-header">
            <h2>KM 知識總覽</h2>
            <p>瀏覽最新知識文章、熱門內容與待辦審核</p>
        </div>

        <!-- KM 知識管理導航 -->
        <div id="km-nav-container"></div>

        <!-- KM 知識管理內容 -->
        <div class="km-container">

            <!-- 三欄 Grid -->
            <div class="km-dashboard-grid">
                <!-- 左欄：最新文章 -->
                <div class="km-block km-grid-latest">
                    <div class="block-header">
                        <h3><i class="fa-solid fa-clock block-icon"></i> 最新文章</h3>
                        <a class="more-link" href="km-shares.html">查看全部 <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                    <div class="block-body" id="latestArticlesBody"></div>
                </div>

                <!-- 中欄：熱門文章 -->
                <div class="km-block km-grid-hot">
                    <div class="block-header">
                        <h3><i class="fa-solid fa-fire block-icon"></i> 熱門文章</h3>
                        <a class="more-link" href="javascript:void(0)">查看全部 <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                    <div class="block-body" id="hotArticlesBody"></div>
                </div>

                <!-- 右欄：個人貢獻 + 文件審核 -->
                <div class="km-grid-side">
                    <div class="km-block">
                        <div class="block-header">
                            <h3><i class="fa-solid fa-pen-nib block-icon"></i> 個人貢獻</h3>
                            <a class="more-link" href="javascript:void(0)">管理文章 <i class="fa-solid fa-arrow-right"></i></a>
                        </div>
                        <div class="block-body">
                            <div class="contrib-stats" id="contribStats"></div>
                            <div class="contrib-list" id="contribList"></div>
                        </div>
                    </div>
                    <div class="km-block">
                        <div class="block-header">
                            <h3><i class="fa-solid fa-clipboard-check block-icon"></i> 文件審核</h3>
                        </div>
                        <div class="review-tabs">
                            <button class="review-tab active" onclick="switchReviewTab('submitted')" data-tab="submitted">
                                我送審的 <span class="tab-count" id="submittedCount">0</span>
                            </button>
                            <button class="review-tab" onclick="switchReviewTab('pending')" data-tab="pending">
                                等我審核 <span class="tab-count" id="pendingCount">0</span>
                            </button>
                        </div>
                        <div class="block-body" id="reviewBody"></div>
                    </div>
                </div>

                <!-- 左兩欄底部：我的收藏 -->
                <div class="km-block km-grid-fav">
                    <div class="block-header">
                        <h3><i class="fa-solid fa-bookmark block-icon"></i> 我的收藏</h3>
                        <a class="more-link" href="javascript:void(0)">查看全部 <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                    <div class="block-body fav-body" id="favArticlesBody"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== 文章內頁 Modal ===== -->
    <div class="article-modal-overlay" id="articleModal">
        <div class="article-modal">
            <div class="am-header">
                <h2 id="amTitle">—</h2>
                <button class="btn ghost" onclick="closeArticleModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="am-meta" id="amMeta"></div>
            <div class="am-body" id="amBody"></div>
            <div class="am-footer">
                <button class="btn" onclick="closeArticleModal()">關閉</button>
            </div>
        </div>
    </div>
    
    <!-- Toast 通知 -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- JS 引用 -->
    <script src="js/main-script.js"></script>
    <script src="js/sidebar-script.js"></script>
    <script src="shared/layout-loader.js"></script>
    <script src="js/km-base.js"></script>

    <script>
    /* ============================================================
       KM 知識總覽 — 四大區塊（假資料）
       ============================================================ */

    // ===== 假資料 =====

    // 最新文章
    const _latestArticles = [
        { id:'a01', title:'2026年度新人訓練手冊已更新', author:'李美玲', dept:'HR', date:'2026-03-16', tags:['培訓','新人'], views: 58,
          content:'<p>各位同仁好，2026年度新人訓練手冊已完成更新，主要調整內容如下：</p><p>1. 新增公司福利與差旅報銷流程<br>2. 更新請假制度與加班規範<br>3. 補充部門介紹與組織架構圖</p><p>請各部門主管協助轉知新進同仁下載閱讀，如有疑問請聯繫 HR 部門。</p>' },
        { id:'a02', title:'X 專案第四週進度報告', author:'張志豪', dept:'BU2', date:'2026-03-15', tags:['專案','進度'], views: 34,
          content:'<p>X 專案本週進度摘要：</p><p>• 前端模組開發完成 85%<br>• API 整合測試進行中<br>• 預計下週完成 UAT 環境部署</p><p>風險項目：第三方 API 回應速度偶有延遲，已與廠商溝通改善中。</p>' },
        { id:'a03', title:'差旅報銷規範修訂公告', author:'吳佳蓉', dept:'Finance', date:'2026-03-14', tags:['差旅','報銷','公告'], views: 102,
          content:'<p>自 2026年4月1日起，差旅報銷規範將進行以下調整：</p><p>1. 國內出差住宿費上限調整為每晚 NT$3,500<br>2. 交通費須於 3 個工作天內提交核銷<br>3. 新增線上簽核流程，無需紙本表單</p><p>詳細內容請參閱附件。</p>' },
        { id:'a04', title:'Code Review 規範 v2.0 發佈', author:'蔡明達', dept:'BU1', date:'2026-03-13', tags:['規範','CR'], views: 76,
          content:'<p>Code Review 規範已更新至 v2.0，主要修訂：</p><p>• PR 必須至少 2 人 Approve 才可合併<br>• 新增安全性檢查清單<br>• CI pipeline 需全部通過<br>• 增加效能相關的 Review 項目</p>' },
        { id:'a05', title:'2025年度財務報表摘要', author:'吳佳蓉', dept:'Finance', date:'2026-03-12', tags:['財報','年度'], views: 45,
          content:'<p>2025年度財務結算已完成，主要數據摘要如下：</p><p>• 營收較去年成長 12%<br>• 營業利益率維持 18%<br>• 研發投入佔營收比例提升至 15%</p><p>詳細報表已上傳至財務部門資料夾。</p>' },
        { id:'a06', title:'系統架構設計文件更新', author:'許家豪', dept:'BU1', date:'2026-03-11', tags:['架構','設計'], views: 29,
          content:'<p>系統架構設計文件已更新，新增微服務拆分方案與 API Gateway 設計。</p><p>請各開發人員於本週內完成閱讀並提供回饋意見。</p>' },
    ];

    // 熱門文章
    const _hotArticles = [
        { id:'h01', title:'差旅報銷規範修訂公告', author:'吳佳蓉', dept:'Finance', views: 1024, tags:['差旅','報銷'] },
        { id:'h02', title:'請假制度常見問題 FAQ', author:'李美玲', dept:'HR', views: 876, tags:['請假','FAQ'] },
        { id:'h03', title:'入職流程 SOP 完整指南', author:'李美玲', dept:'HR', views: 654, tags:['SOP','入職'] },
        { id:'h04', title:'Code Review 規範 v2.0', author:'蔡明達', dept:'BU1', views: 512, tags:['規範','CR'] },
        { id:'h05', title:'X 專案技術架構圖 V3', author:'張志豪', dept:'BU2', views: 389, tags:['架構','機密'] },
        { id:'h06', title:'2025年度財務報表摘要', author:'吳佳蓉', dept:'Finance', views: 301, tags:['財報','年度'] },
        { id:'h07', title:'新人指南 — 快速上手', author:'黃淑芬', dept:'BU2', views: 278, tags:['新人','指南'] },
    ];

    // 我的收藏
    const _favArticles = [
        { id:'f01', title:'差旅報銷規範修訂公告', author:'吳佳蓉', dept:'Finance', savedDate:'2026-03-14', tags:['差旅','報銷'] },
        { id:'f02', title:'Code Review 規範 v2.0', author:'蔡明達', dept:'BU1', savedDate:'2026-03-13', tags:['規範','CR'] },
        { id:'f03', title:'請假制度常見問題 FAQ', author:'李美玲', dept:'HR', savedDate:'2026-03-10', tags:['請假','FAQ'] },
        { id:'f04', title:'系統架構設計文件', author:'許家豪', dept:'BU1', savedDate:'2026-03-08', tags:['架構','設計'] },
    ];

    // 個人貢獻
    const _myContributions = {
        published: [
            { title: '差旅報銷規範修訂公告', date: '2026-03-14', views: 102 },
            { title: 'X 專案第四週進度報告', date: '2026-03-15', views: 34 },
            { title: '2025年度財務報表摘要', date: '2026-03-12', views: 45 },
            { title: 'BU2 部門週報 — W10', date: '2026-03-08', views: 22 },
            { title: '系統維護公告 — 3月排程', date: '2026-03-01', views: 67 },
        ],
        draft: [
            { title: 'Q1 專案回顧簡報（草稿）', date: '2026-03-16', lastEdit: '2026-03-16' },
            { title: '新版 API 設計規格書', date: '2026-03-10', lastEdit: '2026-03-14' },
        ],
        expired: [
            { title: '2025 差旅報銷規範（舊版）', date: '2025-04-10', expiredDate: '2026-03-01' },
            { title: '年度健檢通知 — 2025', date: '2025-09-15', expiredDate: '2025-12-31' },
            { title: '舊版入職流程 SOP v3.0', date: '2025-03-20', expiredDate: '2025-11-20' },
        ],
    };

    // 文件審核 — 我送審的
    const _mySubmitted = [
        { id:'s01', title:'BU2 部門月報 — 2026年3月', reviewer:'黃淑芬', submitDate:'2026-03-15', status:'reviewing', statusText:'審核中' },
        { id:'s02', title:'X 專案提案書 v2', reviewer:'鄭總經理', submitDate:'2026-03-12', status:'pending', statusText:'待審核' },
        { id:'s03', title:'技術選型評估報告', reviewer:'蔡明達', submitDate:'2026-03-08', status:'approved', statusText:'已通過' },
        { id:'s04', title:'Q1 績效自評表', reviewer:'黃淑芬', submitDate:'2026-03-05', status:'rejected', statusText:'退回修改' },
    ];

    // 文件審核 — 等我審核的
    const _pendingMyReview = [
        { id:'r01', title:'新進人員培訓計畫書', submitter:'李美玲', dept:'HR', submitDate:'2026-03-16', status:'pending', statusText:'待審核' },
        { id:'r02', title:'BU1 開發規範修訂草案', submitter:'許家豪', dept:'BU1', submitDate:'2026-03-14', status:'pending', statusText:'待審核' },
        { id:'r03', title:'會議室使用管理辦法', submitter:'楊淑惠', dept:'Admin', submitDate:'2026-03-10', status:'pending', statusText:'待審核' },
    ];

    // ===== 當前審核 Tab =====
    let _reviewTab = 'submitted';

    // ===== 個人貢獻 View =====
    let _contribView = 'published';

    // ===== 初始化 =====
    (function init() {
        renderLatestArticles();
        renderHotArticles();
        renderFavArticles();
        renderContributions();
        updateReviewCounts();
        renderReview();
    })();

    // ===== 最新文章 =====
    function renderLatestArticles() {
        const host = document.getElementById('latestArticlesBody');
        if (!_latestArticles.length) { host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i>暫無最新文章</div>'; return; }
        host.innerHTML = _latestArticles.map(a => `
            <div class="article-item" onclick="openArticle('${a.id}')">
                <div class="article-icon"><i class="fa-solid fa-file-lines"></i></div>
                <div class="article-info">
                    <div class="article-title">${escHtml(a.title)}</div>
                    <div class="article-meta">
                        <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                        <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                        <span><i class="fa-regular fa-calendar"></i> ${a.date}</span>
                        <span><i class="fa-solid fa-eye"></i> ${a.views}</span>
                    </div>
                    <div class="article-tags">${(a.tags||[]).map(t=>'<span class="tag">'+escHtml(t)+'</span>').join('')}</div>
                </div>
            </div>
        `).join('');
    }

    // ===== 熱門文章（列表式）=====
    function renderHotArticles() {
        const host = document.getElementById('hotArticlesBody');
        if (!_hotArticles.length) { host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-fire"></i>暫無熱門文章</div>'; return; }
        host.innerHTML = _hotArticles.map((a, i) => {
            const rankClass = i < 3 ? 'rank-'+(i+1) : 'rank-other';
            const clickAction = i < 3
                ? `window.location.href='km-article.html?id=${a.id}'`
                : `openArticle('${a.id}')`;
            return `
            <div class="article-item" onclick="${clickAction}">
                <div class="rank-badge ${rankClass}">${i+1}</div>
                <div class="article-info">
                    <div class="article-title">${escHtml(a.title)}</div>
                    <div class="article-meta">
                        <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                        <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                        <span><i class="fa-solid fa-eye"></i> ${a.views.toLocaleString()}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    // ===== 我的收藏（水平卡片）=====
    function renderFavArticles() {
        const host = document.getElementById('favArticlesBody');
        if (!_favArticles.length) { host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bookmark"></i>尚無收藏文章</div>'; return; }
        host.innerHTML = '<div class="fav-grid">' + _favArticles.map(a => `
            <div class="fav-card" onclick="openArticle('${a.id}')">
                <div class="fav-card-title">
                    <i class="fa-solid fa-star fav-star"></i>
                    ${escHtml(a.title)}
                </div>
                <div class="fav-card-meta">
                    <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                    <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                </div>
                <div class="fav-card-tags">${(a.tags||[]).map(t=>'<span class="tag">'+escHtml(t)+'</span>').join('')}</div>
            </div>
        `).join('') + '</div>';
    }

    // ===== 個人貢獻 =====
    function renderContributions() {
        const stats = document.getElementById('contribStats');
        const pCount = _myContributions.published.length;
        const dCount = _myContributions.draft.length;
        const eCount = _myContributions.expired.length;
        stats.innerHTML = `
            <div class="contrib-stat-item stat-published ${_contribView==='published'?'':''}" onclick="switchContrib('published')">
                <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-number">${pCount}</div>
                <div class="stat-label"><i class="fa-solid fa-file-lines"></i> 已發表</div>
            </div>
            <div class="contrib-stat-item stat-draft" onclick="switchContrib('draft')">
                <div class="stat-icon"><i class="fa-solid fa-file-pen"></i></div>
                <div class="stat-number">${dCount}</div>
                <div class="stat-label"><i class="fa-solid fa-pencil"></i> 草稿</div>
            </div>
            <div class="contrib-stat-item stat-expired" onclick="switchContrib('expired')">
                <div class="stat-icon"><i class="fa-solid fa-file-circle-xmark"></i></div>
                <div class="stat-number">${eCount}</div>
                <div class="stat-label"><i class="fa-solid fa-clock"></i> 失效</div>
            </div>
        `;
        renderContribList();
    }

    function switchContrib(view) {
        _contribView = view;
        renderContribList();
    }

    function renderContribList() {
        const list = document.getElementById('contribList');
        const items = _myContributions[_contribView] || [];
        if (!items.length) {
            list.innerHTML = '<div class="empty-state" style="padding:20px;"><i class="fa-solid fa-folder-open"></i>暫無資料</div>';
            return;
        }
        if (_contribView === 'published') {
            list.innerHTML = items.map(a => `
                <div class="contrib-article">
                    <span class="contrib-status published">已發表</span>
                    <span class="ca-title">${escHtml(a.title)}</span>
                    <span class="ca-date"><i class="fa-solid fa-eye"></i> ${a.views}</span>
                    <span class="ca-date">${a.date}</span>
                </div>
            `).join('');
        } else if (_contribView === 'draft') {
            list.innerHTML = items.map(a => `
                <div class="contrib-article">
                    <span class="contrib-status draft">草稿</span>
                    <span class="ca-title">${escHtml(a.title)}</span>
                    <span class="ca-date">編輯於 ${a.lastEdit}</span>
                </div>
            `).join('');
        } else {
            list.innerHTML = items.map(a => `
                <div class="contrib-article">
                    <span class="contrib-status expired">失效</span>
                    <span class="ca-title">${escHtml(a.title)}</span>
                    <span class="ca-date">過期 ${a.expiredDate}</span>
                </div>
            `).join('');
        }
    }

    // ===== 文件審核 =====
    function switchReviewTab(tab) {
        _reviewTab = tab;
        document.querySelectorAll('.review-tab').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === tab);
        });
        renderReview();
    }

    function updateReviewCounts() {
        document.getElementById('submittedCount').textContent = _mySubmitted.length;
        document.getElementById('pendingCount').textContent = _pendingMyReview.length;
    }

    function renderReview() {
        const host = document.getElementById('reviewBody');
        if (_reviewTab === 'submitted') {
            if (!_mySubmitted.length) { host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-paper-plane"></i>沒有送審中的文件</div>'; return; }
            host.innerHTML = _mySubmitted.map(d => `
                <div class="article-item">
                    <div class="article-icon"><i class="fa-solid fa-file-arrow-up"></i></div>
                    <div class="article-info">
                        <div class="article-title">${escHtml(d.title)}</div>
                        <div class="article-meta">
                            <span><i class="fa-solid fa-user-check"></i> 審核人：${escHtml(d.reviewer)}</span>
                            <span><i class="fa-regular fa-calendar"></i> ${d.submitDate}</span>
                            <span class="status-badge ${d.status}"><i class="fa-solid ${getStatusIcon(d.status)}"></i> ${d.statusText}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            if (!_pendingMyReview.length) { host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-clipboard-check"></i>沒有待審核的文件</div>'; return; }
            host.innerHTML = _pendingMyReview.map(d => `
                <div class="article-item">
                    <div class="article-icon"><i class="fa-solid fa-file-circle-question"></i></div>
                    <div class="article-info">
                        <div class="article-title">${escHtml(d.title)}</div>
                        <div class="article-meta">
                            <span><i class="fa-solid fa-user"></i> 送審人：${escHtml(d.submitter)}</span>
                            <span><i class="fa-solid fa-building"></i> ${escHtml(d.dept)}</span>
                            <span><i class="fa-regular fa-calendar"></i> ${d.submitDate}</span>
                            <span class="status-badge ${d.status}"><i class="fa-solid ${getStatusIcon(d.status)}"></i> ${d.statusText}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    function getStatusIcon(status) {
        switch(status) {
            case 'pending': return 'fa-clock';
            case 'reviewing': return 'fa-spinner';
            case 'approved': return 'fa-check';
            case 'rejected': return 'fa-rotate-left';
            default: return 'fa-circle';
        }
    }

    // ===== 文章內頁 Modal =====
    function openArticle(id) {
        // 從各資料源尋找文章
        const article = _latestArticles.find(a => a.id === id)
            || _hotArticles.find(a => a.id === id)
            || _favArticles.find(a => a.id === id);
        if (!article) return;

        document.getElementById('amTitle').textContent = article.title;
        document.getElementById('amMeta').innerHTML = `
            <span><i class="fa-solid fa-user"></i> ${escHtml(article.author)}</span>
            <span><i class="fa-solid fa-building"></i> ${escHtml(article.dept)}</span>
            ${article.date ? '<span><i class="fa-regular fa-calendar"></i> '+article.date+'</span>' : ''}
            ${article.views !== undefined ? '<span><i class="fa-solid fa-eye"></i> '+article.views+' 次瀏覽</span>' : ''}
            ${(article.tags||[]).map(t=>'<span style="font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--border-color);background:#fff;">'+escHtml(t)+'</span>').join('')}
        `;
        document.getElementById('amBody').innerHTML = article.content
            || '<p style="color:var(--text-muted);text-align:center;padding:40px 0;">文章內容載入中…</p>';
        document.getElementById('articleModal').classList.add('show');
    }

    function closeArticleModal() {
        document.getElementById('articleModal').classList.remove('show');
    }

    // 點擊 overlay 背景關閉
    document.getElementById('articleModal').addEventListener('click', function(e) {
        if (e.target === this) closeArticleModal();
    });

    // ===== 工具函式 =====
    function escHtml(str) {
        const el = document.createElement('span');
        el.textContent = str;
        return el.innerHTML;
    }
    </script>
    <script src="js/search.js"></script>
</body>
</html>
