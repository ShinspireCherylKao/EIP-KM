<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KM 知識管理 - 企業入口網站</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <style>
        /* ===== 知識總覽頁面專用 ===== */

        /* 歡迎區 */
        .km-welcome {
            text-align: center;
            padding: 28px 20px 12px;
        }
        .km-welcome h2 { font-size: 22px; color: var(--text-primary); margin-bottom: 4px; }
        .km-welcome p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }

        /* 佈局 */
        .km-perm-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            margin-top: 0;
        }
        @media (max-width: 960px) { .km-perm-layout { grid-template-columns: 1fr; } }

        /* 部門樹側邊 */
        .dept-tree-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            height: fit-content;
        }
        .dept-tree-panel .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .dept-tree-panel .panel-body { padding: 10px 14px; }

        .dept-tree details { padding-left: 10px; border-left: 1px dashed #CAD3E0; margin-left: 8px; }
        .dept-tree summary { cursor: pointer; padding: 5px 4px; font-weight: 500; font-size: 13px; list-style: none; user-select: none; }
        .dept-tree summary::-webkit-details-marker { display: none; }
        .dept-tree summary::before { content: '▶'; display: inline-block; margin-right: 6px; font-size: 9px; transition: transform .2s; }
        .dept-tree details[open] > summary::before { transform: rotate(90deg); }
        .dept-tree .tree-link {
            display: block; padding: 5px 10px; margin: 2px 0; border-radius: 6px;
            font-size: 13px; color: var(--text-primary); cursor: pointer; transition: background .15s;
        }
        .dept-tree .tree-link:hover { background: var(--hover-bg); }
        .dept-tree .tree-link.active { background: #EEF2FF; color: #1D4ED8; font-weight: 600; }

        /* 右側主面板 */
        .perm-main-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .perm-main-panel .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .perm-main-panel .panel-body { padding: 16px; }

        /* 標籤 pill */
        .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-color); color: var(--text-secondary); background: #fff; white-space: nowrap; }
        .pill.wl { background: #ECFDF5; border-color: #A7F3D0; color: #047857; }
        .pill.bl { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }
        .pill.inherit { background: #F0F9FF; border-color: #BAE6FD; color: #0369A1; }

        /* 可見性 badge */
        .vis-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
        .vis-badge.whitelist { background: #ECFDF5; color: #047857; }
        .vis-badge.blacklist { background: #FEF2F2; color: #B91C1C; }
        .vis-badge.inherit-badge { background: #F0F9FF; color: #0369A1; }

        /* 動作按鈕 */
        .act-btns { display: flex; gap: 4px; flex-wrap: wrap; }
        .act-btns .btn { padding: 4px 10px; font-size: 12px; }

        /* Modal 覆蓋 */
        .modal-overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(2,6,23,.4); z-index: 100; padding: 12px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            width: min(880px, 94vw); max-height: 90vh; overflow-y: auto;
            background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius); box-shadow: 0 20px 40px rgba(0,0,0,.15);
        }
        .modal-box .m-hd { padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .modal-box .m-hd h3 { font-size: 16px; margin: 0; }
        .modal-box .m-bd { padding: 18px; }
        .modal-box .m-ft { padding: 12px 18px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

        /* 權限設定表格 */
        .perm-table { width: 100%; border-collapse: collapse; }
        .perm-table th, .perm-table td { padding: 9px 10px; border-bottom: 1px solid var(--border-color); text-align: left; font-size: 13px; }
        .perm-table th { background: var(--light-color); color: var(--text-secondary); font-weight: 600; }
        .perm-table tr:hover td { background: var(--hover-bg); }
        .perm-table .remove-btn { color: #EF4444; cursor: pointer; background: none; border: none; font-size: 13px; }
        .perm-table .remove-btn:hover { text-decoration: underline; }

        /* 新增對象輸入 */
        .add-entry-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
        .add-entry-row input, .add-entry-row select { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; }
        .add-entry-row input { flex: 1; }

        /* 摘要卡 */
        .perm-summary-card { background: var(--light-color); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
        .perm-summary-card h4 { font-size: 14px; margin: 0 0 8px; }
        .perm-summary-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin: 0; }
        .perm-summary-card .summary-pills { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

        /* 黑白名單查看面板 */
        .bw-view-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 640px) { .bw-view-grid { grid-template-columns: 1fr; } }
        .bw-card { border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
        .bw-card .bw-card-hd { padding: 10px 14px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .bw-card .bw-card-hd.whitelist-hd { background: #ECFDF5; color: #047857; border-bottom: 2px solid #A7F3D0; }
        .bw-card .bw-card-hd.blacklist-hd { background: #FEF2F2; color: #B91C1C; border-bottom: 2px solid #FECACA; }
        .bw-card .bw-card-bd { padding: 10px 14px; }
        .bw-entry { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #F1F5F9; font-size: 13px; }
        .bw-entry:last-child { border-bottom: none; }
        .bw-entry .entry-type { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--light-color); color: var(--text-secondary); }
        .bw-entry .entry-reason { color: var(--text-muted); font-size: 12px; margin-left: auto; }
        .bw-empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; text-align: center; }

        /* 內聯提示 */
        .hint-text { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

        /* 功能卡片 - 底部導覽 */
        .km-feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .km-feature-card {
            background: var(--white-color); border: 1px solid var(--border-color); border-radius: var(--radius);
            padding: 24px 20px; text-align: left; cursor: pointer; transition: all .25s; text-decoration: none; color: inherit;
            display: block; position: relative; overflow: hidden;
        }
        .km-feature-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: var(--radius) var(--radius) 0 0; }
        .km-feature-card:hover { border-color: transparent; box-shadow: 0 8px 30px rgba(0,0,0,.12); transform: translateY(-3px); }
        .km-feature-card.card-shares::before { background: linear-gradient(135deg,#6366F1,#8B5CF6); }
        .km-feature-card.card-shares:hover { border-color: #8B5CF6; }
        .km-feature-card.card-shares .feature-icon { background: linear-gradient(135deg,#EEF2FF,#EDE9FE); color: #6366F1; }
        .km-feature-card.card-ai::before { background: linear-gradient(135deg,#EF4444,#F97316); }
        .km-feature-card.card-ai:hover { border-color: #EF4444; }
        .km-feature-card.card-ai .feature-icon { background: linear-gradient(135deg,#FEF2F2,#FFF7ED); color: #EF4444; }
        .feature-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 14px; }
        .feature-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .feature-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .feature-arrow { position: absolute; right: 20px; bottom: 22px; font-size: 16px; color: #CBD5E1; transition: all .25s; }
        .km-feature-card:hover .feature-arrow { color: var(--primary-color); transform: translateX(4px); }

        /* 檔案表格適配 */
        .km-table .vis-col { width: 110px; }
        .km-table .act-col { width: 180px; }
    </style>
</head>
<body>
    <!-- 頂部導航 -->
    <div id="header-container"></div>
    
    <!-- 側邊欄 -->
    <div id="sidebar-container"></div>
    
    <!-- 主要內容區 -->
    <div class="main-content">
        <!-- KM 知識管理導航 -->
        <div id="km-nav-container"></div>
        
        <!-- KM 知識管理首頁內容 -->
        <div class="km-container">
            <div class="km-welcome">
                <h2><i class="fa-solid fa-brain"></i> KM 知識管理 — 權限總覽</h2>
                <p>檢視與管理各部門資料夾的黑名單 / 白名單權限設定</p>
            </div>

            <!-- ===== 主功能：部門樹 + 檔案列表 ===== -->
            <div class="km-perm-layout">
                <!-- 左側：部門資料夾樹 -->
                <div class="dept-tree-panel">
                    <div class="panel-header">
                        <strong><i class="fa-solid fa-building"></i> 部門空間</strong>
                        <button class="btn ghost" onclick="toggleTreeAll()" title="展開/收合"><i class="fa-solid fa-arrows-alt-v"></i></button>
                    </div>
                    <div class="panel-body dept-tree" id="deptTree">
                        <!-- 動態生成 -->
                    </div>
                </div>

                <!-- 右側：檔案列表 + 可見性 + 操作 -->
                <div class="perm-main-panel">
                    <div class="panel-header">
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <strong id="currentPath"><i class="fa-solid fa-folder-open"></i> 請選擇資料夾</strong>
                            <span class="pill inherit" id="inheritLabel" style="display:none;">繼承權限</span>
                        </div>
                        <div style="display:flex;gap:6px;">
                            <button class="btn" id="btnViewBW" onclick="openViewBWModal()" disabled><i class="fa-solid fa-list-check"></i> 查看黑白名單</button>
                            <button class="btn primary" id="btnSetPerm" onclick="openPermModal()" disabled><i class="fa-solid fa-shield-halved"></i> 設定權限</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <table class="km-table" id="fileListTable">
                            <thead>
                                <tr>
                                    <th style="width:30%">名稱</th>
                                    <th style="width:18%">標籤</th>
                                    <th>類型</th>
                                    <th>更新時間</th>
                                    <th class="vis-col">可見性</th>
                                    <th class="act-col">操作</th>
                                </tr>
                            </thead>
                            <tbody id="fileListBody">
                                <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px;">
                                    <i class="fa-solid fa-hand-pointer" style="font-size:24px;margin-bottom:8px;display:block;color:#CBD5E1;"></i>
                                    請從左側選擇部門資料夾
                                </td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 底部快捷卡片 -->
            <div class="km-feature-grid">
                <a href="km-shares.html" class="km-feature-card card-shares">
                    <div class="feature-icon"><i class="fa-solid fa-share-nodes"></i></div>
                    <div class="feature-title">分享中心</div>
                    <div class="feature-desc">管理內部文件共用與外部分享連結</div>
                    <div class="feature-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </a>
                <a href="km-ai.html" class="km-feature-card card-ai">
                    <div class="feature-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <div class="feature-title">AI 加值</div>
                    <div class="feature-desc">智能問答、文件比較、知識圖譜</div>
                    <div class="feature-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                </a>
            </div>
        </div>
    </div>

    <!-- ===== Modal：設定黑名單 / 白名單 ===== -->
    <div class="modal-overlay" id="permModal">
        <div class="modal-box">
            <div class="m-hd">
                <h3><i class="fa-solid fa-shield-halved"></i> 權限設定：<span id="permModalTarget">—</span></h3>
                <button class="btn ghost" onclick="closePermModal()"><i class="fa-solid fa-xmark"></i> 關閉</button>
            </div>
            <div class="m-bd">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
                    <!-- 左側：名單設定 -->
                    <div>
                        <b>策略模式</b>
                        <div style="display:flex;gap:16px;margin:8px 0 14px;">
                            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                                <input type="radio" name="permMode" value="whitelist" checked onchange="onPermModeChange()"> 白名單
                            </label>
                            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                                <input type="radio" name="permMode" value="blacklist" onchange="onPermModeChange()"> 黑名單
                            </label>
                        </div>

                        <b id="permListTitle">白名單（允許存取）</b>
                        <table class="perm-table" style="margin-top:6px;">
                            <thead><tr><th>對象</th><th>類型</th><th>瀏覽</th><th>下載</th><th>原因/備註</th><th></th></tr></thead>
                            <tbody id="permListBody"></tbody>
                        </table>

                        <div class="add-entry-row">
                            <input id="addEntryName" placeholder="輸入人員姓名或部門名稱…">
                            <select id="addEntryType">
                                <option value="人員">人員</option>
                                <option value="部門">部門</option>
                            </select>
                            <button class="btn primary" onclick="addPermEntry()"><i class="fa-solid fa-plus"></i> 新增</button>
                        </div>
                        <p class="hint-text"><i class="fa-solid fa-circle-info"></i> 白名單：僅允許名單內的人員/部門存取。黑名單：排除名單內的特定對象。</p>

                        <div style="margin-top:12px;">
                            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
                                <input type="checkbox" id="overrideInherit"> 覆寫上層，停止繼承
                            </label>
                        </div>
                    </div>

                    <!-- 右側：摘要 -->
                    <div>
                        <div class="perm-summary-card">
                            <h4><i class="fa-solid fa-clipboard-list"></i> 權限摘要</h4>
                            <p id="permSummaryText">—</p>
                            <div class="summary-pills" id="permSummaryPills"></div>
                        </div>
                        <div style="margin-top:14px;display:flex;gap:8px;">
                            <button class="btn" onclick="applyToChildren()"><i class="fa-solid fa-arrow-down"></i> 套用到子項</button>
                            <button class="btn ghost" onclick="showInheritChain()"><i class="fa-solid fa-link"></i> 檢視繼承鏈</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="m-ft">
                <button class="btn" onclick="closePermModal()">取消</button>
                <button class="btn primary" onclick="savePermSettings()"><i class="fa-solid fa-check"></i> 儲存</button>
            </div>
        </div>
    </div>

    <!-- ===== Modal：查看黑白名單 ===== -->
    <div class="modal-overlay" id="viewBWModal">
        <div class="modal-box">
            <div class="m-hd">
                <h3><i class="fa-solid fa-list-check"></i> 黑白名單查看：<span id="viewBWTarget">—</span></h3>
                <button class="btn ghost" onclick="closeViewBWModal()"><i class="fa-solid fa-xmark"></i> 關閉</button>
            </div>
            <div class="m-bd">
                <div class="bw-view-grid" id="bwViewGrid">
                    <!-- 動態生成 -->
                </div>
            </div>
            <div class="m-ft">
                <button class="btn" onclick="closeViewBWModal()">關閉</button>
                <button class="btn primary" onclick="closeViewBWModal();openPermModal()"><i class="fa-solid fa-pen"></i> 前往設定</button>
            </div>
        </div>
    </div>

    <!-- ===== Modal：設定單一檔案的黑白名單 ===== -->
    <div class="modal-overlay" id="filePermModal">
        <div class="modal-box">
            <div class="m-hd">
                <h3><i class="fa-solid fa-file-shield"></i> 檔案權限：<span id="filePermTarget">—</span></h3>
                <button class="btn ghost" onclick="closeFilePermModal()"><i class="fa-solid fa-xmark"></i> 關閉</button>
            </div>
            <div class="m-bd">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
                    <div>
                        <b>策略模式</b>
                        <div style="display:flex;gap:16px;margin:8px 0 14px;">
                            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                                <input type="radio" name="filePermMode" value="whitelist" checked onchange="onFilePermModeChange()"> 白名單
                            </label>
                            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                                <input type="radio" name="filePermMode" value="blacklist" onchange="onFilePermModeChange()"> 黑名單
                            </label>
                            <label style="display:flex;align-items:center;gap:4px;cursor:pointer;">
                                <input type="radio" name="filePermMode" value="inherit" onchange="onFilePermModeChange()"> 繼承資料夾
                            </label>
                        </div>
                        <b id="filePermListTitle">白名單（允許存取）</b>
                        <table class="perm-table" style="margin-top:6px;">
                            <thead><tr><th>對象</th><th>類型</th><th>瀏覽</th><th>下載</th><th>備註</th><th></th></tr></thead>
                            <tbody id="filePermListBody"></tbody>
                        </table>
                        <div class="add-entry-row">
                            <input id="fileAddEntryName" placeholder="輸入人員姓名或部門名稱…">
                            <select id="fileAddEntryType">
                                <option value="人員">人員</option>
                                <option value="部門">部門</option>
                            </select>
                            <button class="btn primary" onclick="addFilePermEntry()"><i class="fa-solid fa-plus"></i> 新增</button>
                        </div>
                    </div>
                    <div>
                        <div class="perm-summary-card">
                            <h4><i class="fa-solid fa-clipboard-list"></i> 檔案權限摘要</h4>
                            <p id="filePermSummaryText">—</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="m-ft">
                <button class="btn" onclick="closeFilePermModal()">取消</button>
                <button class="btn primary" onclick="saveFilePermSettings()"><i class="fa-solid fa-check"></i> 儲存</button>
            </div>
        </div>
    </div>

    <!-- ===== Modal：查看單一檔案的黑白名單 ===== -->
    <div class="modal-overlay" id="fileViewBWModal">
        <div class="modal-box">
            <div class="m-hd">
                <h3><i class="fa-solid fa-list-check"></i> 檔案黑白名單：<span id="fileViewBWTarget">—</span></h3>
                <button class="btn ghost" onclick="closeFileViewBWModal()"><i class="fa-solid fa-xmark"></i> 關閉</button>
            </div>
            <div class="m-bd">
                <div class="bw-view-grid" id="fileBWViewGrid"></div>
            </div>
            <div class="m-ft">
                <button class="btn" onclick="closeFileViewBWModal()">關閉</button>
            </div>
        </div>
    </div>
    
    <!-- Toast 通知 -->
    <div id="toastContainer" class="toast-container"></div>
    
    <!-- JS 引用 -->
    <script src="js/main-script.js"></script>
    <script src="js/sidebar-script.js"></script>
    <script src="shared/layout-loader.js"></script>
    <script src="js/km-base.js"></script>

    <script>
    /* ============================================================
       KM 知識管理 — 黑白名單功能（含假資料）
       ============================================================ */

    // ===== 假資料 =====
    const _me = { id:'u001', name:'王小明', dept:'HR', role:'admin' };

    // 人員資料庫
    const _people = [
        { id:'u001', name:'王小明', dept:'HR', title:'HR 主管', probation:false },
        { id:'u002', name:'李美玲', dept:'HR', title:'HR 專員', probation:false },
        { id:'u003', name:'張志豪', dept:'BU2', title:'工程師', probation:false },
        { id:'u004', name:'陳雅婷', dept:'BU2', title:'新進工程師', probation:true },

    // ===== 部門樹 =====
    function renderDeptTree() {
        const host = document.getElementById('deptTree');
        host.innerHTML = buildTreeHTML(_deptFolders, '');
    }

    function buildTreeHTML(nodes, parentPath) {
        let html = '';
        for (const [key, node] of Object.entries(nodes)) {
            const path = key;
            const perm = _folderPerms[path];
            const modeIcon = perm ? (perm.mode === 'blacklist' ? ' <span class="pill bl" style="font-size:10px;">黑</span>' : perm.mode === 'whitelist' ? ' <span class="pill wl" style="font-size:10px;">白</span>' : ' <span class="pill inherit" style="font-size:10px;">繼承</span>') : '';
            if (node.children) {
                html += `<details open>
                    <summary onclick="event.stopPropagation()">
                        <span class="tree-link" onclick="event.stopPropagation();selectFolder('${path}')">${node.label}${modeIcon}</span>
                    </summary>`;
                // 子資料夾
                html += buildTreeHTML(node.children, path);
                html += `</details>`;
            } else {
                html += `<a class="tree-link" onclick="selectFolder('${path}')">${node.label}${modeIcon}</a>`;
            }
        }
        return html;
    }

    function toggleTreeAll() {
        const details = document.querySelectorAll('#deptTree details');
        const allOpen = Array.from(details).every(d => d.open);
        details.forEach(d => d.open = !allOpen);
    }

    // ===== 選取資料夾 =====
    function selectFolder(path) {
        _currentPath = path;
        // 高亮
        document.querySelectorAll('#deptTree .tree-link').forEach(el => el.classList.remove('active'));
        // 找到對應 link
        document.querySelectorAll('#deptTree .tree-link').forEach(el => {
            if (el.onclick && el.getAttribute('onclick')?.includes(`'${path}'`)) {
                el.classList.add('active');
            }
        });

        // 標頭
        document.getElementById('currentPath').innerHTML = `<i class="fa-solid fa-folder-open"></i> ${path}`;
        const perm = _folderPerms[path];
        const inhLabel = document.getElementById('inheritLabel');
        if (perm) {
            inhLabel.style.display = 'inline-flex';
            if (perm.mode === 'blacklist') { inhLabel.textContent = '黑名單模式'; inhLabel.className = 'pill bl'; }
            else if (perm.mode === 'whitelist') { inhLabel.textContent = '白名單模式'; inhLabel.className = 'pill wl'; }
            else { inhLabel.textContent = '繼承權限'; inhLabel.className = 'pill inherit'; }
        } else {
            inhLabel.style.display = 'none';
        }

        // 按鈕啟用
        document.getElementById('btnViewBW').disabled = false;
        document.getElementById('btnSetPerm').disabled = false;

        // 檔案列表
        renderFileList(path);
    }

    // ===== 檔案列表 =====
    function renderFileList(path) {
        const tbody = document.getElementById('fileListBody');
        const items = _files[path] || [];
        if (items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px;">此資料夾目前沒有檔案</td></tr>`;
            return;
        }
        tbody.innerHTML = items.map(it => {
            const icon = getFileIcon(it.name);
            const visBadge = it.visMode === 'blacklist'
                ? '<span class="vis-badge blacklist"><i class="fa-solid fa-ban"></i> 黑名單</span>'
                : it.visMode === 'whitelist'
                ? '<span class="vis-badge whitelist"><i class="fa-solid fa-check-circle"></i> 白名單</span>'
                : '<span class="vis-badge inherit-badge"><i class="fa-solid fa-arrow-turn-down"></i> 繼承</span>';
            const tags = (it.tags || []).map(t => `<span class="pill">${t}</span>`).join(' ') || '—';
            return `<tr>
                <td><div class="file-name">${icon} <b>${it.name}</b></div></td>
                <td>${tags}</td>
                <td>${it.type === 'folder' ? '資料夾' : '檔案'}</td>
                <td>${it.updated}</td>
                <td>${visBadge}</td>
                <td><div class="act-btns">
                    <button class="btn" onclick="openFileViewBWModal('${it.id}')"><i class="fa-solid fa-eye"></i> 查看</button>
                    <button class="btn" onclick="openFilePermModal('${it.id}')"><i class="fa-solid fa-pen"></i> 設定</button>
                </div></td>
            </tr>`;
        }).join('');
    }

    function getFileIcon(name) {
        if (name.endsWith('.pdf')) return '<i class="fa-solid fa-file-pdf pdf-icon"></i>';
        if (name.endsWith('.docx') || name.endsWith('.doc')) return '<i class="fa-solid fa-file-word doc-icon"></i>';
        if (name.endsWith('.xlsx') || name.endsWith('.xls')) return '<i class="fa-solid fa-file-excel xls-icon"></i>';
        if (name.endsWith('.pptx') || name.endsWith('.ppt')) return '<i class="fa-solid fa-file-powerpoint" style="color:#E04E39;"></i>';
        return '<i class="fa-solid fa-file"></i>';
    }

    // ===== 資料夾權限 Modal =====
    function openPermModal() {
        if (!_currentPath) return;
        const perm = _folderPerms[_currentPath];
        if (!perm) return;
        document.getElementById('permModalTarget').textContent = _currentPath;

        // 設定模式
        document.querySelectorAll('input[name="permMode"]').forEach(r => r.checked = (r.value === perm.mode));
        onPermModeChange();

        // 渲染名單
        renderPermList();
        updatePermSummary();
        document.getElementById('permModal').classList.add('show');
    }

    function closePermModal() { document.getElementById('permModal').classList.remove('show'); }

    function onPermModeChange() {
        const mode = document.querySelector('input[name="permMode"]:checked').value;
        const title = document.getElementById('permListTitle');
        title.textContent = mode === 'blacklist' ? '黑名單（排除存取）' : '白名單（允許存取）';
        renderPermList();
        updatePermSummary();
    }

    function renderPermList() {
        const perm = _folderPerms[_currentPath];
        if (!perm) return;
        const mode = document.querySelector('input[name="permMode"]:checked').value;
        const tbody = document.getElementById('permListBody');

        // 同時顯示白名單和黑名單
        let rows = '';
        if (mode === 'whitelist') {
            rows = perm.whitelist.map((e, i) => `<tr>
                <td>${e.name}</td><td><span class="pill">${e.type}</span></td>
                <td><input type="checkbox" ${e.view?'checked':''} onchange="togglePermProp('whitelist',${i},'view',this.checked)"></td>
                <td><input type="checkbox" ${e.download?'checked':''} onchange="togglePermProp('whitelist',${i},'download',this.checked)"></td>
                <td style="font-size:12px;color:var(--text-muted);">${e.reason||''}</td>
                <td><button class="remove-btn" onclick="removePermEntry('whitelist',${i})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`).join('');
        } else {
            // 黑名單模式：先顯示白名單（基礎允許），再顯示黑名單（排除）
            rows += `<tr><td colspan="6" style="background:#ECFDF5;font-weight:600;font-size:12px;color:#047857;"><i class="fa-solid fa-check-circle"></i> 基礎允許（白名單）</td></tr>`;
            rows += perm.whitelist.map((e, i) => `<tr>
                <td>${e.name}</td><td><span class="pill">${e.type}</span></td>
                <td><input type="checkbox" ${e.view?'checked':''} onchange="togglePermProp('whitelist',${i},'view',this.checked)"></td>
                <td><input type="checkbox" ${e.download?'checked':''} onchange="togglePermProp('whitelist',${i},'download',this.checked)"></td>
                <td style="font-size:12px;color:var(--text-muted);">${e.reason||''}</td>
                <td><button class="remove-btn" onclick="removePermEntry('whitelist',${i})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`).join('');
            rows += `<tr><td colspan="6" style="background:#FEF2F2;font-weight:600;font-size:12px;color:#B91C1C;"><i class="fa-solid fa-ban"></i> 排除對象（黑名單）</td></tr>`;
            rows += perm.blacklist.map((e, i) => `<tr style="background:#FFFBFB;">
                <td><b style="color:#B91C1C;">${e.name}</b></td><td><span class="pill bl">${e.type}</span></td>
                <td><input type="checkbox" ${e.view?'checked':''} disabled></td>
                <td><input type="checkbox" ${e.download?'checked':''} disabled></td>
                <td style="font-size:12px;color:#B91C1C;">${e.reason||''}</td>
                <td><button class="remove-btn" onclick="removePermEntry('blacklist',${i})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`).join('');
        }
        tbody.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">尚無設定</td></tr>';
    }

    function togglePermProp(list, idx, prop, val) {
        const perm = _folderPerms[_currentPath];
        if (perm && perm[list] && perm[list][idx]) perm[list][idx][prop] = val;
        updatePermSummary();
    }

    function removePermEntry(list, idx) {
        const perm = _folderPerms[_currentPath];
        if (perm && perm[list]) { perm[list].splice(idx, 1); renderPermList(); updatePermSummary(); }
    }

    function addPermEntry() {
        const name = document.getElementById('addEntryName').value.trim();
        const type = document.getElementById('addEntryType').value;
        if (!name) { alert('請輸入名稱'); return; }
        const perm = _folderPerms[_currentPath];
        const mode = document.querySelector('input[name="permMode"]:checked').value;
        const entry = { name, type, view: mode==='whitelist', download: mode==='whitelist', reason: '' };
        if (mode === 'blacklist') {
            entry.view = false; entry.download = false; entry.reason = '手動加入';
            perm.blacklist.push(entry);
        } else {
            perm.whitelist.push(entry);
        }
        document.getElementById('addEntryName').value = '';
        renderPermList();
        updatePermSummary();
    }

    function updatePermSummary() {
        const perm = _folderPerms[_currentPath];
        if (!perm) return;
        const mode = document.querySelector('input[name="permMode"]:checked').value;
        let text = `- 模式：${mode === 'blacklist' ? '黑名單' : '白名單'}\n`;
        text += `- 繼承：${perm.inherit ? '是（來自上層）' : '否（獨立設定）'}\n`;
        if (perm.whitelist.length) text += `- 白名單：${perm.whitelist.map(e=>`${e.name}(${e.type})`).join('、')}\n`;
        if (perm.blacklist.length) text += `- 黑名單排除：${perm.blacklist.map(e=>`${e.name}(${e.type})`).join('、')}\n`;
        document.getElementById('permSummaryText').textContent = text;
        const pills = [];
        if (perm.whitelist.some(e=>e.view)) pills.push('<span class="pill wl">view</span>');
        if (perm.whitelist.some(e=>e.download)) pills.push('<span class="pill wl">download</span>');
        if (perm.blacklist.length) pills.push('<span class="pill bl">blocked: '+perm.blacklist.length+'</span>');
        document.getElementById('permSummaryPills').innerHTML = pills.join('');
    }

    function savePermSettings() {
        const perm = _folderPerms[_currentPath];
        const mode = document.querySelector('input[name="permMode"]:checked').value;
        perm.mode = mode;
        perm.inherit = !document.getElementById('overrideInherit').checked;
        closePermModal();
        // 重新選擇以刷新
        selectFolder(_currentPath);
        renderDeptTree();
        showToast('權限設定已儲存', 'success');
    }

    function applyToChildren() { showToast('已套用到所有子資料夾與檔案', 'success'); }
    function showInheritChain() {
        const parts = _currentPath.split('/');
        let chain = '';
        let cumPath = '';
        for (let i = 0; i < parts.length; i++) {
            cumPath = i === 0 ? parts[i] : cumPath + '/' + parts[i];
            const p = _folderPerms[cumPath];
            const mode = p ? p.mode : '未設定';
            chain += `${cumPath}  →  ${mode}\n`;
        }
        alert('繼承鏈：\n\n' + chain);
    }

    // ===== 查看黑白名單 Modal（資料夾） =====
    function openViewBWModal() {
        if (!_currentPath) return;
        const perm = _folderPerms[_currentPath];
        if (!perm) return;
        document.getElementById('viewBWTarget').textContent = _currentPath;
        renderBWView(perm, 'bwViewGrid');
        document.getElementById('viewBWModal').classList.add('show');
    }
    function closeViewBWModal() { document.getElementById('viewBWModal').classList.remove('show'); }

    function renderBWView(perm, containerId) {
        const grid = document.getElementById(containerId);
        grid.innerHTML = `
            <div class="bw-card">
                <div class="bw-card-hd whitelist-hd"><i class="fa-solid fa-check-circle"></i> 白名單（允許存取）</div>
                <div class="bw-card-bd">${perm.whitelist.length ? perm.whitelist.map(e => `
                    <div class="bw-entry">
                        <span class="entry-type">${e.type}</span>
                        <b>${e.name}</b>
                        ${e.view ? '<span class="pill wl">瀏覽</span>' : ''}
                        ${e.download ? '<span class="pill wl">下載</span>' : ''}
                        <span class="entry-reason">${e.reason || ''}</span>
                    </div>
                `).join('') : '<div class="bw-empty">無白名單設定</div>'}</div>
            </div>
            <div class="bw-card">
                <div class="bw-card-hd blacklist-hd"><i class="fa-solid fa-ban"></i> 黑名單（排除存取）</div>
                <div class="bw-card-bd">${perm.blacklist.length ? perm.blacklist.map(e => `
                    <div class="bw-entry">
                        <span class="entry-type">${e.type}</span>
                        <b style="color:#B91C1C;">${e.name}</b>
                        <span class="pill bl">禁止存取</span>
                        <span class="entry-reason">${e.reason || ''}</span>
                    </div>
                `).join('') : '<div class="bw-empty">無黑名單設定</div>'}</div>
            </div>
        `;
        // 額外：若是繼承模式，找上層
        if (perm.mode === 'inherit') {
            const inheritFrom = findParentPerm(_currentPath);
            if (inheritFrom) {
                grid.innerHTML = `<div style="grid-column:1/-1;"><div class="perm-summary-card" style="margin-bottom:14px;">
                    <h4><i class="fa-solid fa-arrow-turn-down"></i> 此資料夾為繼承模式</h4>
                    <p>繼承自上層：<b>${inheritFrom.path}</b>（${inheritFrom.perm.mode === 'blacklist' ? '黑名單' : '白名單'}模式）</p>
                </div></div>` + grid.innerHTML;
            }
        }
    }

    function findParentPerm(path) {
        const parts = path.split('/');
        for (let i = parts.length - 1; i >= 1; i--) {
            const parentPath = parts.slice(0, i).join('/');
            const p = _folderPerms[parentPath];
            if (p && p.mode !== 'inherit') return { path: parentPath, perm: p };
        }
        return null;
    }

    // ===== 單一檔案權限模態 =====
    let _currentFileId = null;
    function findFileById(id) {
        for (const [path, files] of Object.entries(_files)) {
            const f = files.find(x => x.id === id);
            if (f) return { file: f, path };
        }
        return null;
    }

    function openFilePermModal(fileId) {
        const result = findFileById(fileId);
        if (!result) return;
        _currentFileId = fileId;
        const { file } = result;
        document.getElementById('filePermTarget').textContent = file.name;
        document.querySelectorAll('input[name="filePermMode"]').forEach(r => r.checked = (r.value === file.visMode));
        onFilePermModeChange();
        renderFilePermList();
        updateFilePermSummary();
        document.getElementById('filePermModal').classList.add('show');
    }
    function closeFilePermModal() { document.getElementById('filePermModal').classList.remove('show'); _currentFileId = null; }

    function onFilePermModeChange() {
        const mode = document.querySelector('input[name="filePermMode"]:checked').value;
        document.getElementById('filePermListTitle').textContent =
            mode === 'blacklist' ? '黑名單（排除存取）' : mode === 'whitelist' ? '白名單（允許存取）' : '繼承資料夾權限';
        renderFilePermList();
        updateFilePermSummary();
    }

    function renderFilePermList() {
        const result = findFileById(_currentFileId);
        if (!result) return;
        const { file } = result;
        const mode = document.querySelector('input[name="filePermMode"]:checked').value;
        const tbody = document.getElementById('filePermListBody');
        if (mode === 'inherit') {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:14px;">繼承資料夾權限，無需獨立設定</td></tr>';
            return;
        }
        let rows = '';
        if (mode === 'whitelist') {
            rows = (file.whitelist || []).map((e, i) => `<tr>
                <td>${e.name}</td><td><span class="pill">${e.type}</span></td>
                <td><input type="checkbox" ${e.view?'checked':''} onchange="toggleFileProp('whitelist',${i},'view',this.checked)"></td>
                <td><input type="checkbox" ${e.download?'checked':''} onchange="toggleFileProp('whitelist',${i},'download',this.checked)"></td>
                <td style="font-size:12px;color:var(--text-muted);">${e.reason||''}</td>
                <td><button class="remove-btn" onclick="removeFilePerm('whitelist',${i})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`).join('');
        } else {
            rows += `<tr><td colspan="6" style="background:#ECFDF5;font-weight:600;font-size:12px;color:#047857;"><i class="fa-solid fa-check-circle"></i> 基礎允許</td></tr>`;
            rows += (file.whitelist || []).map((e, i) => `<tr>
                <td>${e.name}</td><td><span class="pill">${e.type}</span></td>
                <td><input type="checkbox" ${e.view?'checked':''}></td><td><input type="checkbox" ${e.download?'checked':''}></td>
                <td style="font-size:12px;color:var(--text-muted);">${e.reason||''}</td>
                <td><button class="remove-btn" onclick="removeFilePerm('whitelist',${i})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`).join('');
            rows += `<tr><td colspan="6" style="background:#FEF2F2;font-weight:600;font-size:12px;color:#B91C1C;"><i class="fa-solid fa-ban"></i> 排除對象</td></tr>`;
            rows += (file.blacklist || []).map((e, i) => `<tr style="background:#FFFBFB;">
                <td><b style="color:#B91C1C;">${e.name}</b></td><td><span class="pill bl">${e.type}</span></td>
                <td><input type="checkbox" disabled></td><td><input type="checkbox" disabled></td>
                <td style="font-size:12px;color:#B91C1C;">${e.reason||''}</td>
                <td><button class="remove-btn" onclick="removeFilePerm('blacklist',${i})"><i class="fa-solid fa-trash"></i></button></td>
            </tr>`).join('');
        }
        tbody.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">尚無設定</td></tr>';
    }

    function toggleFileProp(list, idx, prop, val) {
        const result = findFileById(_currentFileId);
        if (result && result.file[list] && result.file[list][idx]) result.file[list][idx][prop] = val;
        updateFilePermSummary();
    }

    function removeFilePerm(list, idx) {
        const result = findFileById(_currentFileId);
        if (result && result.file[list]) { result.file[list].splice(idx, 1); renderFilePermList(); updateFilePermSummary(); }
    }

    function addFilePermEntry() {
        const name = document.getElementById('fileAddEntryName').value.trim();
        const type = document.getElementById('fileAddEntryType').value;
        if (!name) { alert('請輸入名稱'); return; }
        const result = findFileById(_currentFileId);
        if (!result) return;
        const mode = document.querySelector('input[name="filePermMode"]:checked').value;
        if (mode === 'inherit') return;
        const entry = { name, type, view: mode==='whitelist', download: mode==='whitelist', reason: '' };
        if (mode === 'blacklist') {
            entry.view = false; entry.download = false; entry.reason = '手動加入';
            result.file.blacklist.push(entry);
        } else {
            result.file.whitelist.push(entry);
        }
        document.getElementById('fileAddEntryName').value = '';
        renderFilePermList();
        updateFilePermSummary();
    }

    function updateFilePermSummary() {
        const result = findFileById(_currentFileId);
        if (!result) return;
        const { file } = result;
        const mode = document.querySelector('input[name="filePermMode"]:checked').value;
        let text = `模式：${mode === 'blacklist'?'黑名單':mode==='whitelist'?'白名單':'繼承'}\n`;
        if (file.whitelist?.length) text += `白名單：${file.whitelist.map(e=>e.name).join('、')}\n`;
        if (file.blacklist?.length) text += `黑名單排除：${file.blacklist.map(e=>e.name).join('、')}\n`;
        document.getElementById('filePermSummaryText').textContent = text;
    }

    function saveFilePermSettings() {
        const result = findFileById(_currentFileId);
        if (!result) return;
        const mode = document.querySelector('input[name="filePermMode"]:checked').value;
        result.file.visMode = mode;
        closeFilePermModal();
        if (_currentPath) renderFileList(_currentPath);
        showToast('檔案權限已儲存', 'success');
    }

    // ===== 查看單一檔案的黑白名單 =====
    function openFileViewBWModal(fileId) {
        const result = findFileById(fileId);
        if (!result) return;
        const { file, path } = result;
        document.getElementById('fileViewBWTarget').textContent = file.name;
        const grid = document.getElementById('fileBWViewGrid');

        // 若繼承，合併資料夾的設定
        let wl = file.whitelist || [];
        let bl = file.blacklist || [];
        let inheritNote = '';
        if (file.visMode === 'inherit') {
            const folderPerm = _folderPerms[path];
            if (folderPerm) {
                wl = folderPerm.whitelist || [];
                bl = folderPerm.blacklist || [];
                inheritNote = `<div style="grid-column:1/-1;"><div class="perm-summary-card" style="margin-bottom:14px;">
                    <h4><i class="fa-solid fa-arrow-turn-down"></i> 此檔案為繼承模式</h4>
                    <p>繼承自資料夾：<b>${path}</b>（${folderPerm.mode}模式）</p>
                </div></div>`;
            }
            // 如果資料夾也是繼承，往上找
            if (folderPerm && folderPerm.mode === 'inherit') {
                const parent = findParentPerm(path);
                if (parent) {
                    wl = parent.perm.whitelist || [];
                    bl = parent.perm.blacklist || [];
                    inheritNote = `<div style="grid-column:1/-1;"><div class="perm-summary-card" style="margin-bottom:14px;">
                        <h4><i class="fa-solid fa-arrow-turn-down"></i> 此檔案為繼承模式</h4>
                        <p>繼承自：<b>${parent.path}</b>（${parent.perm.mode}模式）</p>
                    </div></div>`;
                }
            }
        }

        grid.innerHTML = inheritNote + `
            <div class="bw-card">
                <div class="bw-card-hd whitelist-hd"><i class="fa-solid fa-check-circle"></i> 白名單（允許存取）</div>
                <div class="bw-card-bd">${wl.length ? wl.map(e => `
                    <div class="bw-entry">
                        <span class="entry-type">${e.type}</span>
                        <b>${e.name}</b>
                        ${e.view ? '<span class="pill wl">瀏覽</span>' : ''}
                        ${e.download ? '<span class="pill wl">下載</span>' : ''}
                        <span class="entry-reason">${e.reason || ''}</span>
                    </div>
                `).join('') : '<div class="bw-empty">無白名單設定</div>'}</div>
            </div>
            <div class="bw-card">
                <div class="bw-card-hd blacklist-hd"><i class="fa-solid fa-ban"></i> 黑名單（排除存取）</div>
                <div class="bw-card-bd">${bl.length ? bl.map(e => `
                    <div class="bw-entry">
                        <span class="entry-type">${e.type}</span>
                        <b style="color:#B91C1C;">${e.name}</b>
                        <span class="pill bl">禁止存取</span>
                        <span class="entry-reason">${e.reason || ''}</span>
                    </div>
                `).join('') : '<div class="bw-empty">無黑名單設定</div>'}</div>
            </div>
        `;
        document.getElementById('fileViewBWModal').classList.add('show');
    }
    function closeFileViewBWModal() { document.getElementById('fileViewBWModal').classList.remove('show'); }

    // ===== Toast =====
    function showToast(msg, type) {
        const container = document.getElementById('toastContainer');
        if (!container) { alert(msg); return; }
        const toast = document.createElement('div');
        toast.className = 'toast ' + (type || '');
        toast.innerHTML = `<i class="fa-solid ${type==='success'?'fa-check-circle':'fa-info-circle'}"></i> ${msg}`;
        toast.style.cssText = 'padding:12px 18px;background:#fff;border:1px solid var(--border-color);border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.12);display:flex;align-items:center;gap:8px;font-size:14px;animation:slideIn .3s ease;';
        if (type === 'success') toast.style.borderColor = '#A7F3D0';
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'slideOut .3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 2500);
    }
    </script>
</body>
</html>
