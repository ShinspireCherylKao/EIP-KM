<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - KM 知識管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <link rel="stylesheet" href="css/style-search.css">
    <style>
        /* ===== 我的收藏頁專用 ===== */

        .page-title-bar {
            padding: 4px 0 0;
            margin-left: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .page-title-bar h2 {
            font-size: var(--font-page-title); font-weight: 700; color: #111827; margin: 0;
            display: flex; align-items: center; gap: 10px;
        }
        .page-title-bar h2 i { color: #F59E0B; }
        .page-title-bar .page-desc { color: #9CA3AF; font-size: 13px; margin: 4px 0 0; }
        .back-link-bar {
            margin-bottom: var(--spacing-element);
        }
        .back-link-bar a {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 15px; color: var(--text-secondary); text-decoration: none;
            padding: 8px 14px; border-radius: var(--radius-sm);
            min-height: var(--touch-target-min);
            transition: all .15s;
        }
        .back-link-bar a:hover { background: var(--hover-bg); color: var(--primary-color); }

        /* 操作列 */
        .action-bar {
            display: flex; align-items: center;
            gap: 12px; margin: 20px 0 16px 14px; flex-wrap: wrap;
        }
        .action-bar .search-box {
            position: relative; flex: 1; max-width: 420px;
        }
        .action-bar .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #9CA3AF; font-size: 13px;
        }
        .action-bar .search-box input {
            width: 100%; padding: 8px 12px 8px 34px;
            border: 1px solid #E5E8ED; border-radius: 8px;
            font-size: 13px; background: #fff; color: #374151;
            transition: border-color .2s; box-sizing: border-box;
        }
        .action-bar .search-box input:focus { outline: none; border-color: #4F46E5; }
        /* 結果統計 */
        .result-count { font-size: 13px; color: #9CA3AF; margin: 0 0 12px 14px; }
        .result-count strong { color: #111827; }

        /* 收藏列表卡片 */
        .favorite-list-card {
            background: #FFFFFF;
            background-clip: border-box;
            border: 1px solid rgba(0, 0, 0, .125);
            border-radius: .25rem;
            box-shadow: rgba(176, 184, 214, 0.09) 0px 10px 10px 20px, rgb(176, 184, 214) 10px 10px 15px -5px;
            overflow: hidden;
            margin-left: 14px;
            min-width: 0;
            word-wrap: break-word;
        }
        .favorite-article-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px calc(var(--spacing-card) + 16px);
            cursor: pointer;
            min-height: var(--touch-target-min);
            transition: background .15s;
            position: relative;
        }
        .favorite-article-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 16px;
            height: 1px;
            background: #E5E7EB;
        }
        .favorite-article-item:first-child { padding-top: 36px; }
        .favorite-article-item:last-child { padding-bottom: 36px; }
        .favorite-article-item:last-child::after { display: none; }
        .favorite-article-item:hover { background: #F3F4F6; }

        .favorite-article-item .article-thumb {
            width: 124px; height: 88px;
            border-radius: 0;
            background: linear-gradient(135deg, #FEF3C7 0%, #FFF7ED 100%);
            border: 1px solid #FDE68A;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: #F59E0B;
        }
        .favorite-article-item .article-thumb .thumb-placeholder {
            font-size: 28px;
        }

        .favorite-article-item .article-info { flex: 1; min-width: 0; }
        .favorite-article-item .article-title {
            font-size: var(--font-card-title);
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 6px;
            line-height: var(--line-height-tight);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }
        .favorite-article-item:hover .article-title { color: var(--primary-color); }

        .favorite-article-item .article-meta {
            display: flex; align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: var(--font-body-small);
            color: #7F7F7F;
            margin-top: 6px;
        }
        .favorite-article-item .article-meta span {
            display: flex; align-items: center; gap: 3px;
        }
        .favorite-article-item .article-meta i {
            color: var(--text-muted); font-size: 12px; width: 14px; text-align: center;
        }

        .favorite-article-item .article-excerpt {
            font-size: var(--font-body-small);
            color: #7F7F7F;
            margin-top: 6px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .favorite-article-item .tag-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .favorite-article-item .tag-chip {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 500;
            padding: 1px 8px;
            border-radius: 3px;
            white-space: nowrap;
            background: #4B5563;
            color: #fff;
            border: none;
        }
        .favorite-article-item .article-side {
            flex-shrink: 0;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            padding-top: 2px;
        }
        .favorite-article-item .article-date {
            font-size: var(--font-body-small);
            color: #7F7F7F;
            white-space: nowrap;
            text-align: right;
            line-height: 1.45;
        }
        .favorite-article-item .fav-remove {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: #fff;
            color: #9CA3AF;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
        }
        .favorite-article-item .fav-remove:hover { color: #EF4444; border-color: #FECACA; background: #FEF2F2; }

        .read-state {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
        }
        .read-state.is-read {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
        }
        .read-state.is-unread {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }

        /* 空狀態 */
        .empty-state {
            text-align: center; padding: 60px 20px; color: #9CA3AF;
        }
        .empty-state i { font-size: 32px; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; margin: 0; }

        @media (max-width: 768px) {
            .favorite-article-item {
                flex-wrap: wrap;
                padding: 16px 20px;
            }
            .favorite-article-item:first-child { padding-top: 24px; }
            .favorite-article-item:last-child { padding-bottom: 24px; }
            .favorite-article-item .article-thumb {
                width: 100%;
                height: 120px;
            }
            .favorite-article-item .article-side {
                width: 100%;
                min-width: 0;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .favorite-article-item .article-date {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <!-- 頂部導航 -->
    <div id="header-container"></div>

    <!-- 側邊欄 -->
    <div id="sidebar-container"></div>

    <!-- 主要內容區 -->
    <div class="main-content">
        <div class="km-container">
            <!-- 返回 -->
            <div class="back-link-bar" id="backLinkBar">
                <a href="km-knowledge.html"><i class="fa-solid fa-arrow-left"></i> 返回知識總覽</a>
            </div>
            <script>
            (function(){
                var from = new URLSearchParams(location.search).get('from');
                if (from === 'manage') {
                    document.getElementById('backLinkBar').innerHTML =
                        '<a href="km-manage.html"><i class="fa-solid fa-arrow-left"></i> 返回個人專區</a>';
                }
            })();
            </script>
            <div class="page-title-bar">
                <div>
                    <h2>我的收藏</h2>
                </div>
            </div>

            <!-- 操作列 -->
            <div class="action-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="搜尋收藏文章…" id="searchInput" oninput="searchFavorites()">
                </div>
            </div>

            <!-- 結果統計 -->
            <div class="result-count" id="resultCount"></div>

            <!-- 收藏列表 -->
            <div class="favorite-list-card" id="favoriteListCard"></div>
        </div>
    </div>

    <!-- ===== 文章內頁 Modal ===== -->
    <div class="article-modal-overlay" id="articleModal">
        <div class="article-modal">
            <div class="am-header">
                <h3 id="amTitle">—</h3>
                <button class="btn ghost" onclick="closeArticleModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="am-meta" id="amMeta"></div>
            <div class="am-body" id="amBody"></div>
            <div class="am-footer">
                <button class="btn" onclick="closeArticleModal()">關閉</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JS 引用 -->
    <script src="js/main-script.js"></script>
    <script src="js/sidebar-script.js"></script>
    <script src="shared/layout-loader.js"></script>
    <script src="js/km-base.js"></script>

    <script>
    /* ============================================================
       我的收藏 — 完整列表（假資料）
       ============================================================ */

    const _allFavorites = [
                { id:'f01', title:'差旅報銷規範修訂公告', author:'吳佳蓉', dept:'Finance', savedDate:'2026-03-14', isRead:false, tags:['差旅','報銷'],
          content:'<p>自 2026年4月1日起，差旅報銷規範將進行以下調整：</p><p>1. 國內出差住宿費上限調整為每晚 NT$3,500<br>2. 交通費須於 3 個工作天內提交核銷</p>' },
                { id:'f02', title:'Code Review 規範 v2.0', author:'蔡明達', dept:'BU1', savedDate:'2026-03-13', isRead:true, tags:['規範','CR'],
          content:'<p>Code Review 規範主要修訂：PR 必須至少 2 人 Approve 才可合併，新增安全性檢查清單。</p>' },
                { id:'f03', title:'請假制度常見問題 FAQ', author:'李美玲', dept:'HR', savedDate:'2026-03-10', isRead:true, tags:['請假','FAQ'],
          content:'<p>Q: 特休假可以保留到隔年嗎？<br>A: 依勞基法規定，特休假應於當年度休完。</p>' },
                { id:'f04', title:'系統架構設計文件', author:'許家豪', dept:'BU1', savedDate:'2026-03-08', isRead:false, tags:['架構','設計'],
          content:'<p>系統架構設計文件已更新，新增微服務拆分方案與 API Gateway 設計。</p>' },
                { id:'f05', title:'2025年度財務報表摘要', author:'吳佳蓉', dept:'Finance', savedDate:'2026-03-05', isRead:true, tags:['財報','年度'],
          content:'<p>2025年度主要數據：營收較去年成長 12%，營業利益率維持 18%。</p>' },
                { id:'f06', title:'入職流程 SOP 完整指南', author:'李美玲', dept:'HR', savedDate:'2026-02-28', isRead:false, tags:['SOP','入職'],
          content:'<p>新進人員入職流程：報到日攜帶身分證、畢業證書、存摺影本，IT 部門領取筆電及帳號。</p>' },
                { id:'f07', title:'X 專案技術架構圖 V3', author:'張志豪', dept:'BU2', savedDate:'2026-02-25', isRead:true, tags:['架構','專案'],
          content:'<p>X 專案第三版架構圖已更新，採用微服務架構。</p>' },
                { id:'f08', title:'API 設計規範 RESTful 指南', author:'許家豪', dept:'BU1', savedDate:'2026-02-20', isRead:false, tags:['API','規範'],
          content:'<p>RESTful API 設計原則：使用標準 HTTP 動詞，資源名稱使用複數名詞。</p>' },
                { id:'f09', title:'資安政策宣導 — 2026年度', author:'陳建宏', dept:'BU1', savedDate:'2026-02-15', isRead:true, tags:['資安','政策'],
          content:'<p>2026年度資安政策重點：密碼每 90 天更換一次，禁止使用個人雲端儲存公司資料。</p>' },
                { id:'f10', title:'員工福利手冊 2026 版', author:'李美玲', dept:'HR', savedDate:'2026-02-10', isRead:false, tags:['福利','HR'],
          content:'<p>2026年度員工福利包含年度健檢補助、教育訓練補助、社團活動補助、彈性工時制度。</p>' },
    ];

        let _filtered = [];

    (function init() {
                searchFavorites();
    })();

    function searchFavorites() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        _filtered = _allFavorites.filter(a =>
            !keyword ||
            a.title.toLowerCase().includes(keyword) ||
            a.author.toLowerCase().includes(keyword) ||
            a.dept.toLowerCase().includes(keyword) ||
            (a.tags || []).some(t => t.toLowerCase().includes(keyword))
        ).sort((a, b) => new Date(b.savedDate) - new Date(a.savedDate));
        renderList();
    }

    function stripHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html || '';
        return tmp.textContent || tmp.innerText || '';
    }

    function getReadState(article) {
        return article.isRead
            ? { className: 'is-read', icon: 'fa-circle-check', label: '已閱讀' }
            : { className: 'is-unread', icon: 'fa-clock', label: '未閱讀' };
    }

    function renderList() {
        document.getElementById('resultCount').innerHTML =
            `共 <strong>${_filtered.length}</strong> 篇收藏，依收藏時間新到舊排序`;

        const host = document.getElementById('favoriteListCard');
        if (!_filtered.length) {
            host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bookmark"></i><p>沒有符合條件的收藏文章</p></div>';
            return;
        }
        host.innerHTML = _filtered.map(a => {
            const excerpt = stripHtml(a.content);
            const summary = excerpt.length > 90 ? excerpt.substring(0, 90) + '…' : excerpt;
            const readState = getReadState(a);
            return `
            <div class="favorite-article-item" onclick="openArticle('${a.id}')">
                <div class="article-thumb">
                    <span class="thumb-placeholder"><i class="fa-solid fa-bookmark"></i></span>
                </div>
                <div class="article-info">
                    <h4 class="article-title">${escHtml(a.title)}</h4>
                    <div class="article-meta">
                        <span class="read-state ${readState.className}"><i class="fa-solid ${readState.icon}"></i> ${readState.label}</span>
                        <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                        <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                    </div>
                    <div class="article-excerpt">${escHtml(summary)}</div>
                    <div class="tag-row">${(a.tags || []).map(t => '<span class="tag-chip">' + escHtml(t) + '</span>').join('')}</div>
                </div>
                <div class="article-side">
                    <div class="article-date">收藏於<br>${a.savedDate}</div>
                    <button class="fav-remove" onclick="event.stopPropagation(); removeFav('${a.id}')" title="取消收藏"><i class="fa-solid fa-bookmark-slash"></i></button>
                </div>
            </div>`;
        }).join('');
    }

    function removeFav(id) {
        const idx = _allFavorites.findIndex(a => a.id === id);
        if (idx === -1) return;
        const title = _allFavorites[idx].title;
        _allFavorites.splice(idx, 1);
        searchFavorites();
        showToast('已取消收藏「' + title + '」');
    }

    function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#059669;"></i> ' + msg;
        toast.style.cssText = 'display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E5E8ED;border-radius:10px;padding:12px 18px;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:13px;animation:slideIn .3s ease;';
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'slideOut .3s ease'; setTimeout(() => toast.remove(), 300); }, 2500);
    }

    // ===== 文章 Modal =====
    function openArticle(id) {
        const article = _allFavorites.find(a => a.id === id);
        if (!article) return;
        if (!article.isRead) {
            article.isRead = true;
            renderList();
        }
        const readState = getReadState(article);
        document.getElementById('amTitle').textContent = article.title;
        document.getElementById('amMeta').innerHTML = `
            <span class="read-state ${readState.className}"><i class="fa-solid ${readState.icon}"></i> ${readState.label}</span>
            <span><i class="fa-solid fa-user"></i> ${escHtml(article.author)}</span>
            <span><i class="fa-solid fa-building"></i> ${escHtml(article.dept)}</span>
            <span><i class="fa-regular fa-calendar"></i> 收藏於 ${article.savedDate}</span>
            ${(article.tags || []).map(t => '<span style="font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #E5E8ED;background:#fff;">' + escHtml(t) + '</span>').join('')}
        `;
        document.getElementById('amBody').innerHTML = article.content || '<p style="color:#9CA3AF;text-align:center;padding:40px 0;">文章內容載入中…</p>';
        document.getElementById('articleModal').classList.add('show');
    }
    function closeArticleModal() { document.getElementById('articleModal').classList.remove('show'); }
    document.getElementById('articleModal').addEventListener('click', function (e) { if (e.target === this) closeArticleModal(); });

    function escHtml(str) { const el = document.createElement('span'); el.textContent = str == null ? '' : String(str); return el.innerHTML; }
    </script>
    <script src="js/search.js"></script>
</body>
</html>
