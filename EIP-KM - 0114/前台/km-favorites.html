<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - KM 知識管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <link rel="stylesheet" href="css/style-search.css">
    <style>
        /* ===== 我的收藏頁專用 ===== */

        .page-title-bar {
            padding: 0;
            margin-left: 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .page-title-bar h2 {
            font-size: var(--font-page-title);
            font-weight: 700;
            color: #1E293B;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title-bar h2 i { color: #F59E0B; font-size: .9em; }
        .page-title-bar .page-desc {
            color: var(--text-muted);
            font-size: var(--font-label);
            line-height: 1.6;
            margin: 0;
        }
        .back-link-bar {
            margin-bottom: var(--spacing-element);
        }
        .back-link-bar a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: var(--font-body);
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            min-height: var(--touch-target-min);
            transition: all .15s;
        }
        .back-link-bar a:hover { background: var(--hover-bg); color: var(--primary-color); }

        .favorites-layout {
            grid-template-columns: 272px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
            margin-top: 22px;
        }

        .personal-sidebar {
            position: sticky;
            top: 88px;
            border: 1px solid rgba(0, 0, 0, .125);
            border-radius: .25rem;
            background: #fff;
            box-shadow: rgba(176, 184, 214, 0.09) 0px 10px 10px 20px, rgb(176, 184, 214) 10px 10px 15px -5px;
        }
        .personal-sidebar .panel-header {
            padding: 18px 20px 14px;
            background: #fff;
        }
        .personal-sidebar .panel-header strong {
            font-size: var(--font-section-title);
            font-weight: 700;
        }
        .personal-sidebar .panel-body {
            padding: 14px;
        }
        .sidebar-section {
            padding-top: 10px;
        }
        .sidebar-section.is-shortcut-group {
            padding-top: 0;
        }
        .sidebar-section + .sidebar-section {
            margin-top: 8px;
            border-top: 1px solid #EEF2F7;
        }
        .sidebar-section-title {
            padding: 0 10px 8px;
            font-size: var(--font-caption);
            font-weight: 700;
            letter-spacing: .08em;
            color: #94A3B8;
        }
        .sidebar-nav-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 2px 0;
            padding: 12px 14px 12px 18px;
            border: none;
            border-radius: 10px;
            color: #334155;
            text-decoration: none;
            font-size: var(--font-body-small);
            font-weight: 600;
            transition: background .18s ease, color .18s ease;
        }
        .sidebar-nav-item:hover {
            background: #F8FAFC;
            color: #0F172A;
        }
        .sidebar-nav-item.active {
            background: #EAF2FF;
            color: #2563EB;
            box-shadow: none;
        }
        .sidebar-nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            border-radius: 999px;
            background: #3B82F6;
        }
        .sidebar-nav-item .nav-badge {
            flex-shrink: 0;
            padding: 2px 8px;
            border-radius: 999px;
            background: #F1F5F9;
            color: #64748B;
            font-size: var(--font-caption);
            font-weight: 700;
        }
        .sidebar-nav-item.active .nav-badge {
            background: #DCEAFF;
            color: #2563EB;
        }

        .mobile-mode-switch {
            display: none;
            gap: 10px;
            margin: 0 0 18px;
        }
        .mobile-mode-switch::-webkit-scrollbar {
            display: none;
        }
        .mobile-mode-btn {
            flex: 0 0 auto;
        }
        .mobile-mode-main {
            min-width: 0;
        }

        .favorite-right-panel {
            min-width: 0;
        }

        .favorites-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 18px;
            flex-wrap: wrap;
            padding: 14px 16px;
            border: 1px solid rgba(0, 0, 0, .125);
            border-radius: .25rem;
            background: #fff;
            box-shadow: rgba(176, 184, 214, 0.09) 0px 10px 10px 20px, rgb(176, 184, 214) 10px 10px 15px -5px;
        }
        .favorites-toolbar .km-page-search {
            width: 100%;
            max-width: 360px;
            min-width: 0;
            flex: 1 1 320px;
        }

        .favorite-main-card {
            margin-left: 0;
        }

        .favorite-filter-tabs {
            margin: 0;
            padding: 4px 20px 0;
        }
        .favorite-filter-tabs .search-category-tab {
            min-height: var(--touch-target-min);
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-bottom: 2px solid transparent;
            border-radius: 0;
            background: none;
            color: #9CA3AF;
            margin-bottom: -2px;
        }
        .favorite-filter-tabs .search-category-tab:hover {
            border-color: transparent;
            background: none;
            color: #6B7280;
        }
        .favorite-filter-tabs .search-category-tab.active {
            background: none;
            color: var(--primary-color);
            border-color: transparent;
            border-bottom-color: var(--primary-color);
        }
        .favorite-filter-tabs .search-category-tab .tab-count {
            background: #F3F4F6;
            color: #9CA3AF;
        }
        .favorite-filter-tabs .search-category-tab.active .tab-count {
            background: #DBEAFE;
            color: var(--primary-color);
        }

        /* 結果統計 */
        .result-count {
            font-size: var(--font-body-small);
            color: #9CA3AF;
            margin: 0;
            padding: 0 24px 14px;
        }
        .result-count strong { color: #111827; }

        /* 收藏列表卡片 */
        .favorite-list-card {
            margin-left: 0;
        }
        .favorite-article-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 24px;
            cursor: pointer;
            min-height: var(--touch-target-min);
            transition: background .15s;
            position: relative;
        }
        .favorite-article-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 24px;
            right: 24px;
            height: 1px;
            background: #E5E7EB;
        }
        .favorite-article-item:first-child { padding-top: 28px; }
        .favorite-article-item:last-child { padding-bottom: 28px; }
        .favorite-article-item:last-child::after { display: none; }
        .favorite-article-item:hover { background: #F3F4F6; }

        .favorite-article-item .article-info { flex: 1; min-width: 0; }
        .favorite-article-item .article-title {
            font-size: var(--font-card-title);
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 6px;
            line-height: var(--line-height-tight);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: -0.01em;
        }
        .favorite-article-item:hover .article-title { color: var(--primary-color); }

        .favorite-article-item .article-meta {
            display: flex; align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: var(--font-body-small);
            color: #7F7F7F;
            margin-top: 6px;
        }
        .favorite-article-item .article-meta span {
            display: flex; align-items: center; gap: 3px;
        }
        .favorite-article-item .article-meta i {
            color: var(--text-muted); font-size: 12px; width: 14px; text-align: center;
        }

        .favorite-article-item .article-excerpt {
            font-size: var(--font-body-small);
            color: #7F7F7F;
            margin-top: 6px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .favorite-article-item .tag-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .favorite-article-item .tag-chip {
            display: inline-flex;
            align-items: center;
            font-size: var(--font-label);
            font-weight: 500;
            padding: 1px 8px;
            border-radius: 3px;
            white-space: nowrap;
            background: #4B5563;
            color: #fff;
            border: none;
        }
        .favorite-article-item .article-side {
            flex-shrink: 0;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            padding-top: 2px;
        }
        .favorite-article-item .article-date {
            font-size: var(--font-body-small);
            color: #7F7F7F;
            white-space: nowrap;
            text-align: right;
            line-height: 1.45;
        }
        .favorite-article-item .fav-remove {
            min-width: auto;
            min-height: 32px;
            padding: 7px 10px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: #F59E0B;
            cursor: pointer;
            font-size: var(--font-label);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all .15s;
        }
        .favorite-article-item .fav-remove i {
            font-size: 14px;
            line-height: 1;
        }
        .favorite-article-item .fav-remove:hover { color: #D97706; background: #FEF9EE; }

        .read-state {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: var(--font-caption);
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
        }
        .read-state.is-read {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
        }
        .read-state.is-unread {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
        }

        /* 空狀態 */
        .empty-state {
            text-align: center; padding: 60px 20px; color: #9CA3AF;
        }
        .empty-state i { font-size: 32px; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: var(--font-body-small); margin: 0; }

        @media (min-width: 961px) {
            .back-link-bar {
                margin-bottom: 14px;
            }
            .back-link-bar a {
                padding: 0;
                min-height: auto;
                color: #64748B;
            }
            .back-link-bar a:hover {
                background: transparent;
                color: #111827;
            }
            .page-title-bar {
                align-items: flex-start;
                margin-bottom: 4px;
                padding: 0;
            }
            .page-title-bar h2 {
                font-size: var(--font-page-title);
                line-height: 1.2;
                margin-bottom: var(--spacing-compact);
                color: #1E293B;
                padding: 0;
                letter-spacing: -0.01em;
            }
            .page-title-bar .page-desc {
                margin: 0;
                color: var(--text-muted);
                font-size: var(--font-label);
            }
            .favorites-toolbar .km-page-search {
                max-width: 360px;
            }
        }

        @media (max-width: 960px) {
            .favorites-layout {
                grid-template-columns: 1fr;
                margin-top: 16px;
            }
            .personal-sidebar {
                display: none;
            }
            .mobile-mode-switch {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                scroll-snap-type: x proximity;
                padding-bottom: 4px;
            }
            .mobile-mode-btn {
                scroll-snap-align: start;
            }
            .favorites-toolbar {
                margin: 0 0 14px;
                padding: 0;
                border: none;
                background: transparent;
                box-shadow: none;
            }
            .favorites-toolbar .km-page-search {
                width: 100%;
                max-width: none;
                flex: 1 1 100%;
            }
            .favorite-filter-tabs {
                display: flex;
                flex-wrap: nowrap;
                align-items: center;
                gap: 8px;
                margin: 0;
                padding: 4px;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                scroll-snap-type: x proximity;
                border-bottom: none;
                border: 1px solid #E5EAF3;
                border-radius: 999px;
                background: #F8FAFC;
            }
            .favorite-filter-tabs::-webkit-scrollbar { display: none; }
            .favorite-filter-tabs .search-category-tab {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 auto;
                gap: 6px;
                margin-bottom: 0;
                min-height: 36px;
                padding: 0 14px;
                border: none;
                border-radius: 999px;
                background: transparent;
                color: #64748B;
                font-size: var(--font-label);
                font-weight: 700;
                white-space: nowrap;
                scroll-snap-align: start;
            }
            .favorite-filter-tabs .search-category-tab.active {
                background: #FFFFFF;
                color: #111827;
                border-bottom-color: transparent;
                box-shadow: 0 1px 2px rgba(15,23,42,.10);
            }
            .favorite-filter-tabs .search-category-tab .tab-count {
                margin-left: 2px;
                padding: 1px 6px;
                border-radius: 999px;
                background: rgba(148,163,184,.14);
                color: #94A3B8;
                font-size: var(--font-caption);
                font-weight: 700;
            }
            .favorite-filter-tabs .search-category-tab.active .tab-count {
                background: #DBEAFE;
                color: #4F46E5;
            }
            .result-count {
                padding: 12px 16px;
            }
        }

        @media (max-width: 768px) {
            .page-title-bar {
                gap: 12px;
            }
            .favorite-article-item {
                flex-wrap: wrap;
                padding: 16px 18px;
            }
            .favorite-article-item::after { left: 18px; right: 18px; }
            .favorite-article-item:first-child { padding-top: 24px; }
            .favorite-article-item:last-child { padding-bottom: 24px; }
            .favorite-article-item .article-side {
                width: 100%;
                min-width: 0;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .favorite-article-item .article-date {
                text-align: left;
            }
        }
    </style>
</head>

    <!-- 側邊欄 -->
    <div id="sidebar-container"></div>

    <!-- 主要內容區 -->

            (function(){

                    document.getElementById('backLinkBar').innerHTML =

                }
            })();
            </script>

                </div>

                <div class="favorite-right-panel">
                    <div class="mobile-mode-switch" id="mobileModeSwitch">
                        <a class="mobile-mode-btn km-overview-tile" href="km-manage.html#activity">

                            <span class="mobile-mode-main km-overview-tile-main"><i class="fa-solid fa-star"></i><span>我的收藏</span></span>
                            <span class="km-overview-tile-badge" id="badgeFavoriteMobile">10</span>
                        </a>
                        <a class="mobile-mode-btn km-overview-tile" href="km-manage.html#published">
                            <span class="mobile-mode-main km-overview-tile-main"><i class="fa-solid fa-file-lines"></i><span>個人貢獻</span></span>
                        </a>
                        <a class="mobile-mode-btn km-overview-tile" href="km-manage.html#my-submit">
                            <span class="mobile-mode-main km-overview-tile-main"><i class="fa-solid fa-clipboard-check"></i><span>文件審核</span></span>
                        </a>
                    </div>

                    <div class="favorites-toolbar">
                        <div class="km-page-search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" placeholder="搜尋目前收藏列表…" id="searchInput" oninput="searchFavorites()">
                        </div>
                    </div>

                    <div class="favorite-main-card km-overview-card">
                        <div class="search-category-tabs favorite-filter-tabs km-overview-tab-bar" id="readFilterTabs">

                        </div>

                        <!-- 結果統計 -->
                        <div class="result-count" id="resultCount"></div>

                        <!-- 收藏列表 -->
                        <div class="favorite-list-card" id="favoriteListCard"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 文章內頁 Modal ===== -->

    <!-- Toast 通知 -->

                { id:'f05', title:'2025年度財務報表摘要', author:'吳佳蓉', dept:'Finance', savedDate:'2026-03-05', isRead:true, tags:['財報','年度'],
          content:'<p>2025年度主要數據：營收較去年成長 12%，營業利益率維持 18%。</p>' },

                { id:'f09', title:'資安政策宣導 — 2026年度', author:'陳建宏', dept:'BU1', savedDate:'2026-02-15', isRead:true, tags:['資安','政策'],
          content:'<p>2026年度資安政策重點：密碼每 90 天更換一次，禁止使用個人雲端儲存公司資料。</p>' },
                { id:'f10', title:'員工福利手冊 2026 版', author:'李美玲', dept:'HR', savedDate:'2026-02-10', isRead:false, tags:['福利','HR'],
          content:'<p>2026年度員工福利包含年度健檢補助、教育訓練補助、社團活動補助、彈性工時制度。</p>' },
    ];

        const _favoriteCatalog = _allFavorites.reduce((map, article) => {
            map[article.id] = article;
            return map;
        }, {});
        const _favoriteReadState = _allFavorites.reduce((map, article) => {
            map[article.id] = article.isRead;
            return map;
        }, {});
        let _filtered = [];
        let _currentReadFilter = 'all';

    function getStoredFavoriteIds() {
        const raw = localStorage.getItem('kmArticleFavorites');
        if (raw === null) return null;
        try {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) return [];
            return Array.from(new Set(parsed.filter(id => typeof id === 'string' && id)));
        } catch (error) {
            return [];
        }
    }

    function getFavoriteIds() {
        const storedIds = getStoredFavoriteIds();
        return storedIds === null ? _allFavorites.map(article => article.id) : storedIds;
    }

    function getFavoriteItem(id) {
        const article = _favoriteCatalog[id];
        if (article) {
            return {
                ...article,
                isRead: Object.prototype.hasOwnProperty.call(_favoriteReadState, id)
                    ? _favoriteReadState[id]
                    : article.isRead
            };
        }
        return {
            id: id,
            title: '已收藏文章',
            author: '系統同步',
            dept: 'KM',
            savedDate: '—',
            isRead: !!_favoriteReadState[id],
            tags: ['收藏'],
            content: '<p>此收藏項目暫無預覽內容，請從原文章入口查看詳細內容。</p>'
        };
    }

    function getFavoriteArticles() {
        return getFavoriteIds().map(getFavoriteItem);
    }

    (function init() {
                updateFavoriteCountBadges();
                searchFavorites();
    })();

    function searchFavorites() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const keywordMatched = getFavoriteArticles().filter(a =>
            !keyword ||
            a.title.toLowerCase().includes(keyword) ||
            a.author.toLowerCase().includes(keyword) ||
            a.dept.toLowerCase().includes(keyword) ||
            (a.tags || []).some(t => t.toLowerCase().includes(keyword))
        ).sort((a, b) => {
            const timeA = Date.parse(a.savedDate) || 0;
            const timeB = Date.parse(b.savedDate) || 0;
            return timeB - timeA;
        });

        updateReadFilterTabs(keywordMatched);

        _filtered = keywordMatched.filter(a => {
            if (_currentReadFilter === 'read') return a.isRead;
            if (_currentReadFilter === 'unread') return !a.isRead;
            return true;
        });
        renderList();
    }

    function setReadFilter(filter) {
        _currentReadFilter = filter;
        searchFavorites();
    }

    function updateReadFilterTabs(sourceList) {
        const allCount = sourceList.length;
        const unreadCount = sourceList.filter(a => !a.isRead).length;
        const readCount = sourceList.filter(a => a.isRead).length;

        document.getElementById('allCount').textContent = allCount;
        document.getElementById('unreadCount').textContent = unreadCount;
        document.getElementById('readCount').textContent = readCount;

        document.querySelectorAll('#readFilterTabs .search-category-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === _currentReadFilter);
        });
    }

    function updateFavoriteCountBadges() {
        const count = getFavoriteIds().length;
        ['badgeFavoriteDesktop', 'badgeFavoriteMobile'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = count;
        });
    }

    function stripHtml(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html || '';
        return tmp.textContent || tmp.innerText || '';
    }

    function getReadState(article) {
        return article.isRead
            ? { className: 'is-read', icon: 'fa-circle-check', label: '已閱讀' }
            : { className: 'is-unread', icon: 'fa-clock', label: '未閱讀' };
    }

    function renderList() {
        document.getElementById('resultCount').innerHTML =
            `共 <strong>${_filtered.length}</strong> 篇收藏，依收藏時間新到舊排序`;

        const host = document.getElementById('favoriteListCard');
        if (!_filtered.length) {
            host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-star"></i><p>沒有符合條件的收藏文章</p></div>';
            return;
        }
        host.innerHTML = _filtered.map(a => {
            const excerpt = stripHtml(a.content);
            const summary = excerpt.length > 90 ? excerpt.substring(0, 90) + '…' : excerpt;
            const readState = getReadState(a);
            return `
            <div class="favorite-article-item" onclick="openArticle('${a.id}')">
                <div class="article-info">
                    <h4 class="article-title">${escHtml(a.title)}</h4>
                    <div class="article-meta">
                        <span class="read-state ${readState.className}"><i class="fa-solid ${readState.icon}"></i> ${readState.label}</span>
                        <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                        <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                    </div>
                    <div class="article-excerpt">${escHtml(summary)}</div>
                    <div class="tag-row">${(a.tags || []).map(t => '<span class="tag-chip">' + escHtml(t) + '</span>').join('')}</div>
                </div>
                <div class="article-side">
                    <div class="article-date">收藏於<br>${a.savedDate}</div>
                    <button class="fav-remove" onclick="event.stopPropagation(); removeFav('${a.id}')" title="取消收藏" aria-label="取消收藏" aria-pressed="true"><i class="fa-solid fa-star"></i><span>已收藏</span></button>
                </div>
            </div>`;
        }).join('');
    }

    function removeFav(id) {
        const favoriteIds = getFavoriteIds();
        if (favoriteIds.indexOf(id) === -1) return;
        const title = getFavoriteItem(id).title;
        saveArticleFavorites(favoriteIds.filter(favoriteId => favoriteId !== id));
        updateFavoriteCountBadges();
        searchFavorites();
        showToast('已取消收藏「' + title + '」');
    }

    function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#059669;"></i> ' + msg;
        toast.style.cssText = 'display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E5E8ED;border-radius:10px;padding:12px 18px;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:13px;animation:slideIn .3s ease;';
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'slideOut .3s ease'; setTimeout(() => toast.remove(), 300); }, 2500);
    }

    // ===== 文章 Modal =====
    function openArticle(id) {
        if (getFavoriteIds().indexOf(id) === -1) return;
        let article = getFavoriteItem(id);
        if (!article.isRead) {
            _favoriteReadState[id] = true;
            searchFavorites();
            article = getFavoriteItem(id);
        }
        const readState = getReadState(article);
        document.getElementById('amTitle').textContent = article.title;
        document.getElementById('amMeta').innerHTML = `
            <span class="read-state ${readState.className}"><i class="fa-solid ${readState.icon}"></i> ${readState.label}</span>
            <span><i class="fa-solid fa-user"></i> ${escHtml(article.author)}</span>
            <span><i class="fa-solid fa-building"></i> ${escHtml(article.dept)}</span>
            <span><i class="fa-regular fa-calendar"></i> 收藏於 ${article.savedDate}</span>
            ${(article.tags || []).map(t => '<span style="font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #E5E8ED;background:#fff;">' + escHtml(t) + '</span>').join('')}
        `;
        document.getElementById('amBody').innerHTML = article.content || '<p style="color:#9CA3AF;text-align:center;padding:40px 0;">文章內容載入中…</p>';
        document.getElementById('articleModal').classList.add('show');
    }
    function closeArticleModal() { document.getElementById('articleModal').classList.remove('show'); }
    document.getElementById('articleModal').addEventListener('click', function (e) { if (e.target === this) closeArticleModal(); });

    function escHtml(str) { const el = document.createElement('span'); el.textContent = str == null ? '' : String(str); return el.innerHTML; }
    </script>
    <script src="js/search.js"></script>
</body>
</html>
