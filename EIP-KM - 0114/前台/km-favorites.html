<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - KM 知識管理</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-base.css">
    <link rel="stylesheet" href="css/style-header.css">
    <link rel="stylesheet" href="css/style-sidebar.css">
    <link rel="stylesheet" href="css/style-content.css">
    <link rel="stylesheet" href="css/style-km-base.css">
    <link rel="stylesheet" href="css/style-search.css">
    <style>
        /* ===== 我的收藏頁專用 ===== */

        .page-title-bar {
            padding: 24px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .page-title-bar h2 {
            font-size: var(--font-page-title); font-weight: 700; color: #111827; margin: 0;
            display: flex; align-items: center; gap: 10px;
        }
        .page-title-bar h2 i { color: #F59E0B; }
        .page-title-bar .page-desc { color: #9CA3AF; font-size: 13px; margin: 4px 0 0; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; color: #6B7280; text-decoration: none;
            padding: 6px 12px; border-radius: 8px; transition: all .15s;
        }
        .back-link:hover { background: #F3F4F6; color: #4F46E5; }

        /* 操作列 */
        .action-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin: 20px 0 16px; flex-wrap: wrap;
        }
        .action-bar .search-box {
            position: relative; flex: 1; max-width: 360px;
        }
        .action-bar .search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: #9CA3AF; font-size: 13px;
        }
        .action-bar .search-box input {
            width: 100%; padding: 8px 12px 8px 34px;
            border: 1px solid #E5E8ED; border-radius: 8px;
            font-size: 13px; background: #fff; color: #374151;
            transition: border-color .2s; box-sizing: border-box;
        }
        .action-bar .search-box input:focus { outline: none; border-color: #4F46E5; }
        .action-bar .view-toggle {
            display: flex; gap: 4px;
        }
        .action-bar .view-toggle button {
            width: 36px; height: 36px; border-radius: 8px;
            border: 1px solid #E5E8ED; background: #fff;
            color: #9CA3AF; cursor: pointer; transition: all .15s;
            display: flex; align-items: center; justify-content: center;
        }
        .action-bar .view-toggle button:hover { background: #F3F4F6; }
        .action-bar .view-toggle button.active { background: #4F46E5; color: #fff; border-color: #4F46E5; }

        /* 結果統計 */
        .result-count { font-size: 13px; color: #9CA3AF; margin-bottom: 12px; }
        .result-count strong { color: #111827; }

        /* 收藏卡片 Grid 視圖 */
        .fav-grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .fav-card {
            background: #FFFFFF;
            border: 1px solid #E5E8ED;
            border-radius: 12px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all .2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        .fav-card:hover {
            background: #F9FAFB;
            border-color: #D1D5DB;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,0,0,.06);
        }
        .fav-card .fav-card-title {
            font-size: 14px; font-weight: 600; color: #111827;
            line-height: 1.4; display: flex; align-items: flex-start; gap: 8px;
        }
        .fav-card .fav-card-title .fav-star {
            color: #F59E0B; font-size: 13px; flex-shrink: 0; margin-top: 2px;
        }
        .fav-card:hover .fav-card-title { color: #4F46E5; }
        .fav-card .fav-card-meta {
            font-size: 12px; color: #9CA3AF;
            display: flex; align-items: center; gap: 10px;
        }
        .fav-card .fav-card-meta span { display: flex; align-items: center; gap: 3px; }
        .fav-card .fav-card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .fav-card .fav-card-tags .tag {
            font-size: 11px; padding: 2px 8px; border-radius: 6px;
            border: 1px solid #E5E8ED; color: #6B7280; background: #F9FAFB;
        }
        .fav-card .fav-card-actions {
            position: absolute; top: 12px; right: 12px;
            display: flex; gap: 4px; opacity: 0; transition: opacity .15s;
        }
        .fav-card:hover .fav-card-actions { opacity: 1; }
        .fav-card .fav-card-actions button {
            width: 28px; height: 28px; border-radius: 6px;
            border: 1px solid #E5E8ED; background: #fff;
            color: #9CA3AF; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .fav-card .fav-card-actions button:hover { color: #EF4444; border-color: #FECACA; background: #FEF2F2; }

        /* 收藏列表視圖 */
        .fav-list-view { display: none; }
        .fav-list-card {
            background: #FFFFFF;
            border: 1px solid #E5E8ED;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
            overflow: hidden;
        }
        .fav-list-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 20px; border-bottom: 1px solid #F0F1F3;
            cursor: pointer; transition: background .15s;
        }
        .fav-list-item:last-child { border-bottom: none; }
        .fav-list-item:hover { background: #F3F4F6; }
        .fav-list-item .fav-icon {
            width: 36px; height: 36px; border-radius: 8px;
            background: #FEF3C7; color: #F59E0B;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .fav-list-item .fav-info { flex: 1; min-width: 0; }
        .fav-list-item .fav-title {
            font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 3px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .fav-list-item:hover .fav-title { color: #4F46E5; }
        .fav-list-item .fav-meta {
            font-size: 12px; color: #9CA3AF;
            display: flex; align-items: center; gap: 10px;
        }
        .fav-list-item .fav-meta span { display: flex; align-items: center; gap: 3px; }
        .fav-list-item .fav-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .fav-list-item .fav-tags .tag {
            font-size: 11px; padding: 2px 8px; border-radius: 6px;
            border: 1px solid #E5E8ED; color: #6B7280; background: #F9FAFB;
        }
        .fav-list-item .fav-remove {
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid transparent; background: none;
            color: #D1D5DB; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s; flex-shrink: 0;
        }
        .fav-list-item .fav-remove:hover { color: #EF4444; border-color: #FECACA; background: #FEF2F2; }

        /* 空狀態 */
        .empty-state {
            text-align: center; padding: 60px 20px; color: #9CA3AF;
        }
        .empty-state i { font-size: 32px; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; margin: 0; }
    </style>
</head>
<body>
    <!-- 頂部導航 -->
    <div id="header-container"></div>

    <!-- 側邊欄 -->
    <div id="sidebar-container"></div>

    <!-- 主要內容區 -->
    <div class="main-content">
        <!-- KM 知識管理導航 -->
        <div id="km-nav-container"></div>

        <div class="km-container">
            <!-- 返回 + 標題 -->
            <a class="back-link" href="km-knowledge.html"><i class="fa-solid fa-arrow-left"></i> 返回知識總覽</a>
            <div class="page-title-bar">
                <div>
                    <h2><i class="fa-solid fa-bookmark"></i> 我的收藏</h2>
                    <p class="page-desc">管理您收藏的知識庫文章</p>
                </div>
            </div>

            <!-- 操作列 -->
            <div class="action-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="搜尋收藏文章…" id="searchInput" oninput="searchFavorites()">
                </div>
                <div class="view-toggle">
                    <button class="active" id="btnGrid" onclick="switchView('grid')" title="卡片視圖"><i class="fa-solid fa-grid-2"></i></button>
                    <button id="btnList" onclick="switchView('list')" title="列表視圖"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>

            <!-- 結果統計 -->
            <div class="result-count" id="resultCount"></div>

            <!-- Grid 視圖 -->
            <div class="fav-grid-view" id="favGridView"></div>

            <!-- List 視圖 -->
            <div class="fav-list-view" id="favListView">
                <div class="fav-list-card" id="favListCard"></div>
            </div>
        </div>
    </div>

    <!-- ===== 文章內頁 Modal ===== -->
    <div class="article-modal-overlay" id="articleModal">
        <div class="article-modal">
            <div class="am-header">
                <h3 id="amTitle">—</h3>
                <button class="btn ghost" onclick="closeArticleModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="am-meta" id="amMeta"></div>
            <div class="am-body" id="amBody"></div>
            <div class="am-footer">
                <button class="btn" onclick="closeArticleModal()">關閉</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- JS 引用 -->
    <script src="js/main-script.js"></script>
    <script src="js/sidebar-script.js"></script>
    <script src="shared/layout-loader.js"></script>
    <script src="js/km-base.js"></script>

    <script>
    /* ============================================================
       我的收藏 — 完整列表（假資料）
       ============================================================ */

    const _allFavorites = [
        { id:'f01', title:'差旅報銷規範修訂公告', author:'吳佳蓉', dept:'Finance', savedDate:'2026-03-14', tags:['差旅','報銷'],
          content:'<p>自 2026年4月1日起，差旅報銷規範將進行以下調整：</p><p>1. 國內出差住宿費上限調整為每晚 NT$3,500<br>2. 交通費須於 3 個工作天內提交核銷</p>' },
        { id:'f02', title:'Code Review 規範 v2.0', author:'蔡明達', dept:'BU1', savedDate:'2026-03-13', tags:['規範','CR'],
          content:'<p>Code Review 規範主要修訂：PR 必須至少 2 人 Approve 才可合併，新增安全性檢查清單。</p>' },
        { id:'f03', title:'請假制度常見問題 FAQ', author:'李美玲', dept:'HR', savedDate:'2026-03-10', tags:['請假','FAQ'],
          content:'<p>Q: 特休假可以保留到隔年嗎？<br>A: 依勞基法規定，特休假應於當年度休完。</p>' },
        { id:'f04', title:'系統架構設計文件', author:'許家豪', dept:'BU1', savedDate:'2026-03-08', tags:['架構','設計'],
          content:'<p>系統架構設計文件已更新，新增微服務拆分方案與 API Gateway 設計。</p>' },
        { id:'f05', title:'2025年度財務報表摘要', author:'吳佳蓉', dept:'Finance', savedDate:'2026-03-05', tags:['財報','年度'],
          content:'<p>2025年度主要數據：營收較去年成長 12%，營業利益率維持 18%。</p>' },
        { id:'f06', title:'入職流程 SOP 完整指南', author:'李美玲', dept:'HR', savedDate:'2026-02-28', tags:['SOP','入職'],
          content:'<p>新進人員入職流程：報到日攜帶身分證、畢業證書、存摺影本，IT 部門領取筆電及帳號。</p>' },
        { id:'f07', title:'X 專案技術架構圖 V3', author:'張志豪', dept:'BU2', savedDate:'2026-02-25', tags:['架構','專案'],
          content:'<p>X 專案第三版架構圖已更新，採用微服務架構。</p>' },
        { id:'f08', title:'API 設計規範 RESTful 指南', author:'許家豪', dept:'BU1', savedDate:'2026-02-20', tags:['API','規範'],
          content:'<p>RESTful API 設計原則：使用標準 HTTP 動詞，資源名稱使用複數名詞。</p>' },
        { id:'f09', title:'資安政策宣導 — 2026年度', author:'陳建宏', dept:'BU1', savedDate:'2026-02-15', tags:['資安','政策'],
          content:'<p>2026年度資安政策重點：密碼每 90 天更換一次，禁止使用個人雲端儲存公司資料。</p>' },
        { id:'f10', title:'員工福利手冊 2026 版', author:'李美玲', dept:'HR', savedDate:'2026-02-10', tags:['福利','HR'],
          content:'<p>2026年度員工福利包含年度健檢補助、教育訓練補助、社團活動補助、彈性工時制度。</p>' },
    ];

    let _currentView = 'grid';
    let _filtered = [..._allFavorites];

    (function init() {
        renderAll();
    })();

    function searchFavorites() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        _filtered = _allFavorites.filter(a =>
            !keyword ||
            a.title.toLowerCase().includes(keyword) ||
            a.author.toLowerCase().includes(keyword) ||
            a.dept.toLowerCase().includes(keyword) ||
            (a.tags || []).some(t => t.toLowerCase().includes(keyword))
        );
        renderAll();
    }

    function switchView(view) {
        _currentView = view;
        document.getElementById('btnGrid').classList.toggle('active', view === 'grid');
        document.getElementById('btnList').classList.toggle('active', view === 'list');
        document.getElementById('favGridView').style.display = view === 'grid' ? 'grid' : 'none';
        document.getElementById('favListView').style.display = view === 'list' ? 'block' : 'none';
    }

    function renderAll() {
        document.getElementById('resultCount').innerHTML =
            `共 <strong>${_filtered.length}</strong> 篇收藏`;
        renderGrid();
        renderList();
    }

    function renderGrid() {
        const host = document.getElementById('favGridView');
        if (!_filtered.length) {
            host.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fa-solid fa-bookmark"></i><p>沒有符合條件的收藏文章</p></div>';
            return;
        }
        host.innerHTML = _filtered.map(a => `
            <div class="fav-card" onclick="openArticle('${a.id}')">
                <div class="fav-card-actions">
                    <button onclick="event.stopPropagation(); removeFav('${a.id}')" title="取消收藏"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="fav-card-title">
                    <i class="fa-solid fa-star fav-star"></i>
                    ${escHtml(a.title)}
                </div>
                <div class="fav-card-meta">
                    <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                    <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                    <span><i class="fa-regular fa-calendar"></i> ${a.savedDate}</span>
                </div>
                <div class="fav-card-tags">${(a.tags || []).map(t => '<span class="tag">' + escHtml(t) + '</span>').join('')}</div>
            </div>
        `).join('');
    }

    function renderList() {
        const host = document.getElementById('favListCard');
        if (!_filtered.length) {
            host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-bookmark"></i><p>沒有符合條件的收藏文章</p></div>';
            return;
        }
        host.innerHTML = _filtered.map(a => `
            <div class="fav-list-item" onclick="openArticle('${a.id}')">
                <div class="fav-icon"><i class="fa-solid fa-star"></i></div>
                <div class="fav-info">
                    <div class="fav-title">${escHtml(a.title)}</div>
                    <div class="fav-meta">
                        <span><i class="fa-solid fa-user"></i> ${escHtml(a.author)}</span>
                        <span><i class="fa-solid fa-building"></i> ${escHtml(a.dept)}</span>
                        <span><i class="fa-regular fa-calendar"></i> 收藏於 ${a.savedDate}</span>
                    </div>
                </div>
                <div class="fav-tags">${(a.tags || []).map(t => '<span class="tag">' + escHtml(t) + '</span>').join('')}</div>
                <button class="fav-remove" onclick="event.stopPropagation(); removeFav('${a.id}')" title="取消收藏"><i class="fa-solid fa-bookmark"></i></button>
            </div>
        `).join('');
    }

    function removeFav(id) {
        const idx = _allFavorites.findIndex(a => a.id === id);
        if (idx === -1) return;
        const title = _allFavorites[idx].title;
        _allFavorites.splice(idx, 1);
        searchFavorites();
        showToast('已取消收藏「' + title + '」');
    }

    function showToast(msg) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#059669;"></i> ' + msg;
        toast.style.cssText = 'display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E5E8ED;border-radius:10px;padding:12px 18px;box-shadow:0 4px 12px rgba(0,0,0,.1);font-size:13px;animation:slideIn .3s ease;';
        container.appendChild(toast);
        setTimeout(() => { toast.style.animation = 'slideOut .3s ease'; setTimeout(() => toast.remove(), 300); }, 2500);
    }

    // ===== 文章 Modal =====
    function openArticle(id) {
        const article = _allFavorites.find(a => a.id === id);
        if (!article) return;
        document.getElementById('amTitle').textContent = article.title;
        document.getElementById('amMeta').innerHTML = `
            <span><i class="fa-solid fa-user"></i> ${escHtml(article.author)}</span>
            <span><i class="fa-solid fa-building"></i> ${escHtml(article.dept)}</span>
            <span><i class="fa-regular fa-calendar"></i> 收藏於 ${article.savedDate}</span>
            ${(article.tags || []).map(t => '<span style="font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid #E5E8ED;background:#fff;">' + escHtml(t) + '</span>').join('')}
        `;
        document.getElementById('amBody').innerHTML = article.content || '<p style="color:#9CA3AF;text-align:center;padding:40px 0;">文章內容載入中…</p>';
        document.getElementById('articleModal').classList.add('show');
    }
    function closeArticleModal() { document.getElementById('articleModal').classList.remove('show'); }
    document.getElementById('articleModal').addEventListener('click', function (e) { if (e.target === this) closeArticleModal(); });

    function escHtml(str) { const el = document.createElement('span'); el.textContent = str; return el.innerHTML; }
    </script>
    <script src="js/search.js"></script>
</body>
</html>
